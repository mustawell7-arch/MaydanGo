openapi: 3.1.0
info: { title: Operations, version: 1.0.0 }
paths:
  /member/device:
    get:
      operationId: getMemberDeviceStatus
      responses:
        "200":
          description: Current installation status and any active 24-hour change request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDeviceStatus" }
    post:
      operationId: registerMemberDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberDeviceRegistration" }
      responses:
        "200":
          description: Current installation status after registration or change request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDeviceStatus" }
  /member/device/change:
    delete:
      operationId: cancelMemberDeviceChange
      responses:
        "200":
          description: Pending device change cancelled by the active primary installation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDeviceStatus" }
  /support/staff/device-changes:
    get:
      operationId: getSupportPendingDeviceChanges
      responses:
        "200":
          description: Pending device changes for authorized support staff
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportDeviceChange" }
  /support/staff/device-changes/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: approveSupportDeviceChange
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceChangeApprovalInput" }
      responses:
        "200":
          description: Pending change approved early and recorded for audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportDeviceChangeReview" }
  /member/support/tickets:
    get:
      operationId: getMemberSupportTickets
      responses:
        "200":
          description: Tickets owned by the signed-in member
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportTicketSummary" } }
    post:
      operationId: createMemberSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportTicketInput" }
      responses:
        "201":
          description: Private support conversation created for the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/support/tickets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMemberSupportTicket
      responses:
        "200":
          description: Ticket and replies belonging to the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/support/tickets/{id}/replies:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: replyMemberSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportReplyInput" }
      responses:
        "201":
          description: Member reply saved to the owned ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/notifications/settings:
    get:
      operationId: getMemberNotificationSettings
      responses:
        "200":
          description: Signed-in member's push preference and registered device count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    put:
      operationId: updateMemberNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Notification preference updated for the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
  /member/notifications/devices:
    post:
      operationId: registerMemberPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeviceInput" }
      responses:
        "200":
          description: Device registered after explicit member opt-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    delete:
      operationId: unregisterMemberPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeviceRemoval" }
      responses:
        "200":
          description: Device removed and push disabled when no registered devices remain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
  /support/staff/tickets:
    get:
      operationId: getSupportStaffTickets
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/SupportTicketStatus" } }
      responses:
        "200":
          description: Support queue, accessible only to authorized support staff and administrators
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportStaffTicketSummary" } }
  /support/staff/tickets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getSupportStaffTicket
      responses:
        "200":
          description: Staff view of a ticket, its replies, and its status and assignment history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
    patch:
      operationId: updateSupportStaffTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportStaffTicketUpdate" }
      responses:
        "200":
          description: Ticket status or assignment updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
  /support/staff/tickets/{id}/replies:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: replySupportStaffTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportReplyInput" }
      responses:
        "201":
          description: Staff reply saved and member notification attempted separately
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
  /support/staff/agents:
    get:
      operationId: getSupportStaffAgents
      responses:
        "200":
          description: Authorized support team roster
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportAgent" } }
    post:
      operationId: addSupportStaffAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAgentInput" }
      responses:
        "201":
          description: Support role assigned by an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAgent" }
  /support/staff/agents/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 160, pattern: "^[A-Za-z0-9_-]{1,160}$" }
    delete:
      operationId: removeSupportStaffAgent
      responses:
        "200":
          description: Support access revoked immediately; existing tickets remain intact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAgent" }
  /support/staff/agents/{userId}/urgent-alerts:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 160, pattern: "^[A-Za-z0-9_-]{1,160}$" }
    patch:
      operationId: updateSupportStaffAgentUrgentAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAgentUrgentAlertInput" }
      responses:
        "200":
          description: Authorized administrator updated urgent alert eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAgent" }
  /support/staff/urgent-alert-recipient-history:
    get:
      operationId: getSupportUrgentAlertRecipientHistory
      responses:
        "200":
          description: Latest administrator-only urgent alert recipient changes; no device or report data
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportUrgentAlertRecipientAudit" }
  /support/staff/urgent-alert-delivery-outcomes:
    get:
      operationId: getSupportUrgentAlertDeliveryOutcomes
      responses:
        "200":
          description: Latest admin-only per-recipient urgent push outcomes, without device tokens or report content
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportUrgentAlertDeliveryOutcome" }
  /support/staff/access-history:
    get:
      operationId: getSupportStaffAccessHistory
      responses:
        "200":
          description: Latest administrator-only support role grant and removal audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportStaffAccessAuditEvent" }
  /support/staff/notification-failures:
    get:
      operationId: getSupportNotificationFailures
      responses:
        "200":
          description: Recent failed, retrying, and unresolved-receipt push attempts without exposing device tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/NotificationFailure" } }
  /operations:
    get:
      operationId: getOperations
      responses:
        "200":
          description: Authorized staff data, scoped to assigned partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsState" }
  /operations/partners:
    post:
      operationId: addPartner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerInput" }
      responses:
        "201":
          description: Unapproved partner created by admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
  /operations/partners/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: approvePartner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerApproval" }
      responses:
        "200":
          description: Approval changed by admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
  /operations/offerings:
    post:
      operationId: addLiveOffering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingInput" }
      responses:
        "201":
          description: Dated live offering created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/offerings/recurring:
    post:
      operationId: createRecurringOfferings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringOfferingsInput" }
      responses:
        "201":
          description: Individually bookable future sessions created as one atomic batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringOfferingsResponse" }
        "409":
          description: The entire batch was rejected because one or more Baghdad dates overlap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringOfferingConflict" }
  /operations/offerings/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: changeLiveOffering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingUpdate" }
      responses:
        "200":
          description: Capacity or publishing state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/offerings/{id}/waitlist:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getOfferingWaitlist
      responses:
        "200":
          description: Ordered waitlist and current offer state for an authorized partner offering
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OfferingWaitlistEntry" } }
  /operations/offerings/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: cancelLiveOffering
      responses:
        "200":
          description: Future session cancelled; reservations released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationSuccess" }
  /operations/offerings/{id}/series:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: changeRecurringOfferingSeries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingUpdate" }
      responses:
        "200":
          description: Future sessions in the recurring series updated atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringOfferingsResponse" }
  /operations/offerings/{id}/series/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: cancelRecurringOfferingSeries
      responses:
        "200":
          description: Unbooked future sessions cancelled and sessions with bookings or attendance preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelRecurringOfferingSeriesResponse" }
  /operations/offerings/{id}/submit:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: submitLiveOffering
      responses:
        "200":
          description: Partner submitted its own draft activity for administrator review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/offerings/{id}/respond:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: respondToOfferingCorrection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingPartnerResponse" }
      responses:
        "200":
          description: Partner response saved and activity resubmitted for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/offerings/{id}/review:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: reviewOfferingApproval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingReviewInput" }
      responses:
        "200":
          description: Administrator decision saved and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/bookings/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: cancelAdminBooking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingCancellationRequest" }
      responses:
        "200":
          description: Future active booking cancelled, waitlist queue processed, and action audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationSuccess" }
  /operations/courses:
    get:
      operationId: getOperationCourses
      responses:
        "200":
          description: All courses and lesson counts available to administrators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GetOperationCoursesResponse" }
    post:
      operationId: createLearningCourse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "201":
          description: Course content created by an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAdminRecord" }
  /operations/courses/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: updateLearningCourse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseMetadataInput" }
      responses:
        "200":
          description: Course metadata or publishing state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAdminRecord" }
  /operations/courses/{id}/lessons:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: addLearningLesson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonInput" }
      responses:
        "201":
          description: Lesson added to a course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseLesson" }
  /operations/plans:
    post:
      operationId: addMembershipPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "201":
          description: Plan created by admin; does not activate memberships
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LivePlan" }
  /operations/plans/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: replaceMembershipPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "200":
          description: Plan updated for future grants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LivePlan" }
  /operations/grants:
    post:
      operationId: grantLiveAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessGrantInput" }
      responses:
        "201":
          description: Audited trial or corporate grant; paid plans always rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationSuccess" }
  /operations/revoke:
    post:
      operationId: revokeLiveAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRevokeInput" }
      responses:
        "200":
          description: Live access terminated and active reservations cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationSuccess" }
  /operations/refunds:
    post:
      operationId: requestMembershipRefund
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRequest" }
      responses:
        "202":
          description: Refund queued for independent finance approval; no provider request has been made
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceReviewItem" }
  /operations/finance:
    get:
      operationId: getFinanceOverview
      responses:
        "200":
          description: Finance and administrator records without provider credentials or bank details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceOverview" }
  /operations/finance/settlements:
    get:
      operationId: getFinanceSettlements
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Partner settlement eligibility from confirmed attendance, with disputes and holds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceSettlementSummary" }
  /operations/finance/refunds/{billingId}:
    parameters:
      - name: billingId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: requestFinanceRefund
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceRefundRequest" }
      responses:
        "201":
          description: Refund queued for a different authorized reviewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceReviewItem" }
  /operations/finance/payouts:
    post:
      operationId: requestFinancePayoutTracking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancePayoutRequest" }
      responses:
        "201":
          description: Manual payout tracking request; this endpoint never transfers funds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceReviewItem" }
  /operations/finance/reviews/{id}/decision:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: decideFinanceReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceDecision" }
      responses:
        "200":
          description: Independent finance decision recorded with an append-only audit event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceReviewItem" }
  /operations/finance/invoices/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: reviewPartnerFinanceInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceInvoiceReview" }
      responses:
        "200":
          description: Invoice review status saved and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerInvoice" }
  /operations/finance/invoices/{id}/document:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: downloadFinancePartnerInvoice
      responses:
        "200":
          description: Private partner invoice PDF for authorized finance staff
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /operations/finance/audit:
    get:
      operationId: getFinanceAudit
      responses:
        "200":
          description: Append-only finance and operations audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceAudit" }
  /operations/settlements:
    get:
      operationId: getPartnerSettlementSummary
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Partner-scoped attendance summary for a date range; no payout approval or amount calculation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerSettlementSummary" }
  /operations/invoices:
    get:
      operationId: getPartnerInvoices
      responses:
        "200":
          description: Invoice submissions belonging to the authenticated partner
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PartnerInvoice" } }
    post:
      operationId: submitPartnerInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerInvoiceInput" }
      responses:
        "201":
          description: Invoice received for separate review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerInvoice" }
  /operations/invoices/upload-url:
    post:
      operationId: requestPartnerInvoiceUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerInvoiceUploadInput" }
      responses:
        "200":
          description: Short-lived URL for direct upload of a private PDF invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerInvoiceUploadUrl" }
  /operations/invoices/{id}/document:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: downloadPartnerInvoiceDocument
      responses:
        "200":
          description: Private invoice PDF for the authenticated partner
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { description: Invoice not found }
  /member/live-catalog:
    get:
      operationId: getLiveCatalog
      responses:
        "200":
          description: Approved partners and future active live offerings only
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LiveOffering" } }
  /member/courses:
    get:
      operationId: getMemberCourses
      responses:
        "200":
          description: Published course summaries and this member’s server-side progress
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CourseSummary" } }
  /member/courses/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMemberCourse
      responses:
        "200":
          description: Course outline and gated lesson content for the current membership and enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
  /member/courses/{id}/enroll:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: enrollMemberCourse
      responses:
        "200":
          description: Account enrollment saved after live membership checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
  /member/courses/{id}/progress:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: updateCourseProgress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseProgressInput" }
      responses:
        "200":
          description: Lesson progress saved to the member account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
  /member/courses/{id}/lessons/{lessonId}/playback-link:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: lessonId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: createMemberCoursePlaybackLink
      responses:
        "200":
          description: Short-lived recording link after membership and enrollment checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoursePlaybackLinkResponse" }
  /member/course-playback:
    get:
      operationId: streamMemberCoursePlayback
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Private course recording stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Partial private course recording stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /member/live-classes:
    get:
      operationId: getMemberLiveClasses
      responses:
        "200":
          description: Approved, future live-class schedules and this member’s booking state without join links
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MemberLiveClass" } }
  /member/live-classes/{id}/join:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: createLiveClassJoin
      responses:
        "200":
          description: Short-lived access details after booking, schedule and membership checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinAccess" }
  /member/offerings/{id}/waitlist:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: joinMemberWaitlist
      responses:
        "200":
          description: Account's waitlist entries after joining a full live class
          content:
            application/json:
              schema: { $ref: "./openapi.yaml#/components/schemas/MemberState" }
  /member/waitlist/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      operationId: leaveMemberWaitlist
      responses:
        "200":
          description: Account's waitlist entries after leaving the queue
          content:
            application/json:
              schema: { $ref: "./openapi.yaml#/components/schemas/MemberState" }
  /member/waitlist/{id}/accept:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: acceptMemberWaitlistOffer
      responses:
        "200":
          description: Account state after accepting a place offer
          content:
            application/json:
              schema: { $ref: "./openapi.yaml#/components/schemas/MemberState" }
  /member/plans:
    get:
      operationId: getLivePlans
      responses:
        "200":
          description: Active plans; paid plans are purchasable only when provider checks pass
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LivePlan" } }
  /member/checkout:
    post:
      operationId: createMemberCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberCheckoutInput" }
      responses:
        "200":
          description: Provider-hosted checkout URL; the URL alone never activates access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCheckoutResult" }
  /member/subscription:
    get:
      operationId: getMemberSubscription
      responses:
        "200":
          description: Signed-in member's own paid subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberSubscriptionResponse" }
  /member/subscription/cancel:
    post:
      operationId: cancelMemberSubscription
      responses:
        "200":
          description: Renewal stopped at period end; access remains until then
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCancellationResult" }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
  schemas:
    MemberDevicePlatform:
      type: string
      enum: [ios, android, unknown]
    MemberDeviceStatus:
      type: object
      additionalProperties: false
      required: [status, currentPlatform, pendingActivationAt, pendingPlatform, pendingRiskFlag, waitHours]
      properties:
        status: { type: string, enum: [primary, pending, revoked] }
        currentPlatform: { anyOf: [{ $ref: "#/components/schemas/MemberDevicePlatform" }, { type: "null" }] }
        pendingActivationAt: { type: ["string", "null"], format: date-time }
        pendingPlatform: { anyOf: [{ $ref: "#/components/schemas/MemberDevicePlatform" }, { type: "null" }] }
        pendingRiskFlag: { type: boolean }
        waitHours: { type: integer, const: 24 }
    MemberDeviceRegistration:
      type: object
      additionalProperties: false
      required: [platform]
      properties:
        platform: { type: string, enum: [ios, android] }
    SupportDeviceChange:
      type: object
      additionalProperties: false
      required: [id, userId, requestedAt, activateAt, fromPlatform, toPlatform, riskFlag]
      properties:
        id: { type: string }
        userId: { type: string }
        requestedAt: { type: string, format: date-time }
        activateAt: { type: string, format: date-time }
        fromPlatform: { $ref: "#/components/schemas/MemberDevicePlatform" }
        toPlatform: { $ref: "#/components/schemas/MemberDevicePlatform" }
        riskFlag: { type: boolean }
    DeviceChangeApprovalInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500 }
    SupportDeviceChangeReview:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [support_approved] }
    SupportTicketStatus:
      type: string
      enum: [open, in_progress, waiting_member, resolved, closed]
    SupportTicketCategory:
      type: string
      enum: [booking, account, access, safety, other]
    SupportedLanguage:
      type: string
      enum: [en, ar, ku]
    SupportTicketInput:
      type: object
      additionalProperties: false
      required: [subject, category, message, language]
      properties:
        subject: { type: string, minLength: 4, maxLength: 120 }
        category: { $ref: "#/components/schemas/SupportTicketCategory" }
        message: { type: string, minLength: 10, maxLength: 5000 }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
        urgent: { type: boolean, default: false }
    SupportReplyInput:
      type: object
      additionalProperties: false
      required: [message, language]
      properties:
        message: { type: string, minLength: 1, maxLength: 5000 }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
    SupportTicketSummary:
      type: object
      required: [id, subject, category, urgent, status, language, createdAt, updatedAt, lastMessageAt]
      properties:
        id: { type: string }
        subject: { type: string }
        category: { $ref: "#/components/schemas/SupportTicketCategory" }
        urgent: { type: boolean }
        status: { $ref: "#/components/schemas/SupportTicketStatus" }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }
    SupportTicketEvent:
      type: object
      required: [action, createdAt]
      properties:
        action: { type: string }
        previousStatus: { type: [string, "null"] }
        nextStatus: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    SupportMessage:
      type: object
      required: [id, authorRole, message, language, createdAt]
      properties:
        id: { type: string }
        authorRole: { type: string, enum: [member, support, admin] }
        message: { type: string }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
        createdAt: { type: string, format: date-time }
    SupportTicketDetail:
      allOf:
        - $ref: "#/components/schemas/SupportTicketSummary"
        - type: object
          required: [messages, events]
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/SupportMessage" } }
            events: { type: array, items: { $ref: "#/components/schemas/SupportTicketEvent" } }
    SupportStaffTicketSummary:
      allOf:
        - $ref: "#/components/schemas/SupportTicketSummary"
        - type: object
          required: [memberUserId, assignedTo, urgentAlertStatus, urgentOverdue]
          properties:
            memberUserId: { type: string }
            assignedTo: { type: [string, "null"] }
            urgentAlertStatus: { type: string, enum: [not_applicable, pending, accepted, fallback_required] }
            urgentOverdue: { type: boolean }
    SupportStaffMessage:
      allOf:
        - $ref: "#/components/schemas/SupportMessage"
        - type: object
          required: [authorId]
          properties: { authorId: { type: string } }
    SupportStaffEvent:
      allOf:
        - $ref: "#/components/schemas/SupportTicketEvent"
        - type: object
          required: [actorId, previousAssignee, nextAssignee, detail]
          properties:
            actorId: { type: string }
            previousAssignee: { type: [string, "null"] }
            nextAssignee: { type: [string, "null"] }
            detail: { type: string }
    SupportStaffTicketDetail:
      allOf:
        - $ref: "#/components/schemas/SupportStaffTicketSummary"
        - type: object
          required: [messages, events]
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/SupportStaffMessage" } }
            events: { type: array, items: { $ref: "#/components/schemas/SupportStaffEvent" } }
    SupportStaffTicketUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { $ref: "#/components/schemas/SupportTicketStatus" }
        assignedTo:
          anyOf:
            - type: string
            - type: "null"
    SupportAgent:
      type: object
      required: [userId, role, receiveUrgentAlerts]
      properties:
        userId: { type: string }
        role: { type: string, enum: [admin, support] }
        receiveUrgentAlerts: { type: boolean }
        pushEnabled: { type: boolean, description: Present only to administrators. }
        activeDeviceCount: { type: integer, minimum: 0, description: Present only to administrators; never includes device tokens. }
    SupportAgentInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties: { userId: { type: string, minLength: 1, maxLength: 160, pattern: "^[A-Za-z0-9_-]{1,160}$" } }
    SupportAgentUrgentAlertInput:
      type: object
      additionalProperties: false
      required: [receiveUrgentAlerts]
      properties:
        receiveUrgentAlerts: { type: boolean }
    SupportUrgentAlertRecipientAudit:
      type: object
      additionalProperties: false
      required: [id, actorId, recipientUserId, fromReceiving, toReceiving, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string }
        recipientUserId: { type: string }
        fromReceiving: { type: boolean }
        toReceiving: { type: boolean }
        createdAt: { type: string, format: date-time }
    SupportUrgentAlertDeliveryOutcome:
      type: object
      additionalProperties: false
      required: [ticketId, recipientUserId, kind, deviceCount, acceptedDeviceCount, failedDeviceCount, retryPendingDeviceCount, pendingDeviceCount, cancelledDeviceCount, receiptOkCount, receiptPendingCount, receiptErrorCount, receiptUnavailableCount, receiptNotCheckedCount, attemptCount, createdAt, latestActivityAt, sendStatus, receiptStatus]
      properties:
        ticketId: { type: string }
        recipientUserId: { type: string }
        kind: { type: string, enum: [support_urgent, support_urgent_escalation] }
        deviceCount: { type: integer, minimum: 0 }
        acceptedDeviceCount: { type: integer, minimum: 0 }
        failedDeviceCount: { type: integer, minimum: 0 }
        retryPendingDeviceCount: { type: integer, minimum: 0 }
        pendingDeviceCount: { type: integer, minimum: 0 }
        cancelledDeviceCount: { type: integer, minimum: 0 }
        receiptOkCount: { type: integer, minimum: 0 }
        receiptPendingCount: { type: integer, minimum: 0 }
        receiptErrorCount: { type: integer, minimum: 0 }
        receiptUnavailableCount: { type: integer, minimum: 0 }
        receiptNotCheckedCount: { type: integer, minimum: 0 }
        attemptCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        latestActivityAt: { type: string, format: date-time }
        sendStatus: { type: string, enum: [accepted, partial, retrying, pending, failed, cancelled] }
        receiptStatus: { type: string, enum: [no_receipt, pending, no_error, partial, error, unavailable] }
    SupportStaffAccessAuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorId, targetUserId, action, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string }
        targetUserId: { type: string }
        action: { type: string, enum: [granted, removed] }
        createdAt: { type: string, format: date-time }
    NotificationSettings:
      type: object
      required: [pushEnabled, language, registeredDevices]
      properties:
        pushEnabled: { type: boolean }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
        registeredDevices: { type: integer, minimum: 0 }
    NotificationSettingsInput:
      type: object
      additionalProperties: false
      required: [pushEnabled, language]
      properties:
        pushEnabled: { type: boolean }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
    PushDeviceInput:
      type: object
      additionalProperties: false
      required: [token, platform, language]
      properties:
        token: { type: string, minLength: 20, maxLength: 512, pattern: "^(Expo|Exponent)PushToken\\[[A-Za-z0-9_-]+\\]$" }
        platform: { type: string, enum: [ios, android] }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
    PushDeviceRemoval:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 512 }
    NotificationFailure:
      type: object
      required: [id, userId, kind, title, status, error, attemptCount, nextAttemptAt, receiptStatus, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        kind: { type: string }
        title: { type: string }
        status: { type: string, enum: [failed, retry_pending, sent] }
        error: { type: string }
        attemptCount: { type: integer, minimum: 0 }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
        receiptStatus: { type: string, enum: [pending, ok, error, unavailable], nullable: true }
        createdAt: { type: string, format: date-time }
    OperationSuccess:
      type: object
      required: [ok]
      properties: { ok: { type: boolean } }
    CancelRecurringOfferingSeriesResponse:
      type: object
      additionalProperties: false
      required: [ok, cancelledDates, preservedDates]
      properties:
        ok: { type: boolean }
        cancelledDates:
          type: array
          uniqueItems: true
          items: { type: string, format: date, description: "Baghdad dates cancelled in this batch." }
        preservedDates:
          type: array
          uniqueItems: true
          items: { type: string, format: date, description: "Baghdad dates left unchanged because they have reservations or attendance." }
    BookingCancellationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
    PartnerInput:
      type: object
      additionalProperties: false
      required: [name, groupId, ownerUserId]
      properties:
        name: { type: string }
        groupId: { type: string }
        ownerUserId: { type: string }
    Partner:
      allOf:
        - $ref: "#/components/schemas/PartnerInput"
        - type: object
          required: [id, approved]
          properties: { id: { type: string }, approved: { type: boolean } }
    PartnerApproval:
      type: object
      additionalProperties: false
      required: [approved]
      properties: { approved: { type: boolean } }
    OfferingInput:
      type: object
      required: [partnerId, title, kind, city, facility, category, accessType, tiers, startsAt, endsAt, cancellationDeadline, capacity, active]
      properties:
        partnerId: { type: string }
        title: { type: string }
        localizedTitle:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        localizedDescription:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        joinUrl: { type: ["string", "null"], format: uri }
        kind: { type: string, enum: [session, event, coach] }
        city: { type: string }
        facility: { type: string }
        category: { type: string }
        accessType: { type: string, enum: [physical, premium, live] }
        tiers: { type: array, items: { type: string }, minItems: 1 }
        startsAt: { type: string }
        endsAt: { type: string }
        cancellationDeadline: { type: string }
        capacity: { type: integer, minimum: 1 }
        waitlistOfferMinutes: { type: integer, minimum: 5, maximum: 1440, default: 30 }
        gender: { type: string, enum: [all, female, male] }
        minAge: { type: integer, minimum: 0 }
        maxAge: { type: [integer, "null"] }
        additionalPayment: { type: boolean }
        active: { type: boolean }
    RecurringSchedule:
      type: object
      additionalProperties: false
      required: [repeatUntil]
      properties:
        mode: { type: string, enum: [daily, weekly, custom, dates], default: weekly }
        repeatUntil: { type: string, format: date, description: "Last local date to include, no more than 90 days after the first date." }
        interval: { type: integer, minimum: 1, maximum: 30, default: 1, description: "Days for daily schedules; weeks for custom schedules." }
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 0, maximum: 6, description: "Sunday is 0 and Saturday is 6." }
        dates:
          type: array
          maxItems: 89
          uniqueItems: true
          items: { type: string, format: date, description: "Additional local session date; the template's first date is included automatically." }
        excludedDates:
          type: array
          maxItems: 90
          uniqueItems: true
          items: { type: string, format: date, description: "Date to skip, such as a local holiday." }
    RecurringOfferingsInput:
      type: object
      additionalProperties: false
      required: [template, schedule]
      properties:
        template: { $ref: "#/components/schemas/OfferingInput" }
        schedule: { $ref: "#/components/schemas/RecurringSchedule" }
    RecurringOfferingsResponse:
      type: array
      minItems: 1
      items: { $ref: "#/components/schemas/LiveOffering" }
    RecurringOfferingConflict:
      type: object
      additionalProperties: false
      required: [conflictingDates]
      properties:
        conflictingDates:
          type: array
          minItems: 1
          maxItems: 90
          uniqueItems: true
          items: { type: string, format: date, description: "A conflicting session date in Asia/Baghdad." }
    LiveOffering:
      allOf:
        - $ref: "#/components/schemas/OfferingInput"
        - type: object
          required: [id, targetId, slot, scope, approvalStatus]
          properties:
            id: { type: string }
            targetId: { type: string }
            slot: { type: string }
            scope: { type: string }
            cancelledAt: { type: [string, "null"] }
            recurrenceGroupId: { type: [string, "null"], description: "Shared identifier for sessions created as one recurring series." }
            approvalStatus: { $ref: "#/components/schemas/OfferingApprovalStatus" }
            approvalReason: { type: ["string", "null"], maxLength: 1000 }
            partnerResponse: { type: ["string", "null"], maxLength: 1000 }
            submittedAt: { type: ["string", "null"], format: date-time }
            reviewedAt: { type: ["string", "null"], format: date-time }
            reviewedBy: { type: ["string", "null"] }
            partnerName: { type: string }
            remaining: { type: integer }
            canJoin: { type: boolean }
            waitlistOfferMinutes: { type: integer, minimum: 5, maximum: 1440 }
            checkinPolicy:
              oneOf:
                - $ref: "#/components/schemas/SessionCheckinPolicy"
                - type: "null"
    OfferingApprovalStatus:
      type: string
      enum: [draft, submitted, under_review, changes_requested, approved, published, rejected, archived]
    OfferingReviewInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/OfferingApprovalStatus" }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    OfferingPartnerResponse:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response: { type: string, minLength: 5, maxLength: 1000 }
    SessionCheckinPolicy:
      type: object
      required: [latitude, longitude, radius, opensAt, closesAt, correctionEndsAt]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        radius: { type: integer }
        opensAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        correctionEndsAt: { type: string, format: date-time }
    OfferingWaitlistEntry:
      type: object
      required: [id, queuePosition, status, createdAt]
      properties:
        id: { type: string }
        queuePosition: { type: integer, minimum: 1 }
        status: { type: string, enum: [waiting, offered, booked, expired, left, ineligible, closed] }
        createdAt: { type: string, format: date-time }
        offerExpiresAt: { type: ["string", "null"], format: date-time }
        respondedAt: { type: ["string", "null"], format: date-time }
    OfferingUpdate:
      type: object
      additionalProperties: false
      required: [capacity]
      properties:
        capacity: { type: integer, minimum: 1 }
        waitlistOfferMinutes: { type: integer, minimum: 5, maximum: 1440 }
        localizedTitle: { $ref: "#/components/schemas/LocalizedText" }
        localizedDescription: { $ref: "#/components/schemas/LocalizedText" }
        joinUrl: { type: ["string", "null"], format: uri }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cancellationDeadline: { type: string, format: date-time }
    LocalizedText:
      type: object
      additionalProperties: false
      required: [en, ar, ku]
      properties:
        en: { type: string, minLength: 1, maxLength: 240 }
        ar: { type: string, minLength: 1, maxLength: 240 }
        ku: { type: string, minLength: 1, maxLength: 240 }
    CourseMetadataInput:
      type: object
      additionalProperties: false
      required: [localizedTitle, localizedSummary, localizedInstructor, category, level, durationMinutes, thumbnailUrl, published]
      properties:
        localizedTitle: { $ref: "#/components/schemas/LocalizedText" }
        localizedSummary: { $ref: "#/components/schemas/LocalizedText" }
        localizedInstructor: { $ref: "#/components/schemas/LocalizedText" }
        category: { type: string, minLength: 1, maxLength: 120 }
        level: { type: string, enum: [beginner, intermediate, advanced, all-levels] }
        durationMinutes: { type: integer, minimum: 1, maximum: 10000 }
        thumbnailUrl: { type: ["string", "null"], format: uri }
        published: { type: boolean }
    LessonInput:
      type: object
      additionalProperties: false
      required: [position, localizedTitle, localizedContent, durationMinutes, mediaUrl]
      properties:
        position: { type: integer, minimum: 1 }
        localizedTitle: { $ref: "#/components/schemas/LocalizedText" }
        localizedContent: { $ref: "#/components/schemas/LocalizedText" }
        durationMinutes: { type: integer, minimum: 1, maximum: 1000 }
        mediaUrl:
          type: string
          pattern: "^/objects/course-recordings/[A-Za-z0-9_-]{1,180}\\.(mp4|webm|m4v|mov|m4a|mp3|aac|ogg)$"
    CourseInput:
      allOf:
        - $ref: "#/components/schemas/CourseMetadataInput"
        - type: object
          required: [lessons]
          properties:
            lessons: { type: array, minItems: 1, items: { $ref: "#/components/schemas/LessonInput" } }
    CourseAdminRecord:
      allOf:
        - $ref: "#/components/schemas/CourseMetadataInput"
        - type: object
          required: [id, title, lessonCount, createdAt, updatedAt]
          properties:
            id: { type: string }
            title: { type: string }
            lessonCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    GetOperationCoursesResponse:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items: { $ref: "#/components/schemas/CourseAdminRecord" }
    CourseSummary:
      allOf:
        - $ref: "#/components/schemas/CourseMetadataInput"
        - type: object
          required: [id, title, lessonCount, enrolled, completedLessons]
          properties:
            id: { type: string }
            title: { type: string }
            lessonCount: { type: integer }
            enrolled: { type: boolean }
            completedLessons: { type: integer }
    CourseLesson:
      type: object
      required: [id, position, localizedTitle, localizedContent, durationMinutes, mediaUrl, hasRecording, completed]
      properties:
        id: { type: string }
        position: { type: integer }
        localizedTitle: { $ref: "#/components/schemas/LocalizedText" }
        localizedContent:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
