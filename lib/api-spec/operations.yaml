              schema:
                type: array
                items: { $ref: "#/components/schemas/SuperAdminLegalPolicyVersion" }
    post:
      operationId: createSuperAdminLegalPolicyDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLegalPolicyDraftBody" }
      responses:
        "201":
          description: A new editable draft version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperAdminLegalPolicyVersion" }
        "409":
          description: The policy version already exists
  /super-admin/policies/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateSuperAdminLegalPolicyDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLegalPolicyDraftBody" }
      responses:
        "200":
          description: The updated draft version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperAdminLegalPolicyVersion" }
        "404":
          description: Draft not found
        "409":
          description: Published policy versions are immutable
  /super-admin/policies/{id}/publish:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: publishSuperAdminLegalPolicyVersion
      responses:
        "200":
          description: The policy version is published and effective on its selected date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperAdminLegalPolicyVersion" }
        "400":
          description: All supported languages need complete policy text before publication
        "404":
          description: Draft not found
        "409":
          description: The policy version has already been published
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    MemberDevicePlatform:
      type: string
      enum: [ios, android, unknown]
    MemberDeviceStatus:
      type: object
      additionalProperties: false
      required: [status, currentPlatform, pendingActivationAt, pendingPlatform, pendingRiskFlag, waitHours]
      properties:
        status: { type: string, enum: [primary, pending, revoked] }
        currentPlatform: { anyOf: [{ $ref: "#/components/schemas/MemberDevicePlatform" }, { type: "null" }] }
        pendingActivationAt: { type: ["string", "null"], format: date-time }
        pendingPlatform: { anyOf: [{ $ref: "#/components/schemas/MemberDevicePlatform" }, { type: "null" }] }
        pendingRiskFlag: { type: boolean }
        waitHours: { type: integer, minimum: 1, maximum: 168 }
    MemberDeviceRegistration:
      type: object
      additionalProperties: false
      required: [platform]
      properties:
        platform: { type: string, enum: [ios, android] }
    SupportDeviceChange:
      type: object
      additionalProperties: false
      required: [id, userId, requestedAt, activateAt, fromPlatform, toPlatform, riskFlag]
      properties:
        id: { type: string }
        userId: { type: string }
        requestedAt: { type: string, format: date-time }
        activateAt: { type: string, format: date-time }
        fromPlatform: { $ref: "#/components/schemas/MemberDevicePlatform" }
        toPlatform: { $ref: "#/components/schemas/MemberDevicePlatform" }
        riskFlag: { type: boolean }
    DeviceChangeApprovalInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500 }
    SupportDeviceChangeReview:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
