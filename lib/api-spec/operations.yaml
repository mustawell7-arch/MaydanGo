openapi: 3.1.0
info: { title: Operations, version: 1.0.0 }
paths:
  /member/device:
    get:
      operationId: getMemberDeviceStatus
      responses:
        "200":
          description: Current installation status and configured device-change wait
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDeviceStatus" }
    post:
      operationId: registerMemberDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberDeviceRegistration" }
      responses:
        "200":
          description: Current installation status after registration or change request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDeviceStatus" }
  /member/device/change:
    delete:
      operationId: cancelMemberDeviceChange
      responses:
        "200":
          description: Pending device change cancelled by the active primary installation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDeviceStatus" }
  /support/staff/device-changes:
    get:
      operationId: getSupportPendingDeviceChanges
      responses:
        "200":
          description: Pending device changes for authorized support staff
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportDeviceChange" }
  /support/staff/device-changes/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: approveSupportDeviceChange
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceChangeApprovalInput" }
      responses:
        "200":
          description: Pending change approved early and recorded for audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportDeviceChangeReview" }
  /member/support/tickets:
    get:
      operationId: getMemberSupportTickets
      responses:
        "200":
          description: Tickets owned by the signed-in member
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportTicketSummary" } }
    post:
      operationId: createMemberSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportTicketInput" }
      responses:
        "201":
          description: Private support conversation created for the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/privacy-requests:
    get:
      operationId: getMemberPrivacyRequests
      responses:
        "200":
          description: Privacy requests belonging to the signed-in member
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PrivacyRequest" } }
    post:
      operationId: createMemberPrivacyRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyRequestInput" }
      responses:
        "201":
          description: A private support case was created for human review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyRequest" }
        "409":
          description: An active privacy request already exists
  /member/consents:
    get:
      operationId: getMemberConsents
      responses:
        "200":
          description: Current policy versions, the member's latest choices, and their immutable consent history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberConsentState" }
    post:
      operationId: saveMemberConsents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberConsentInput" }
      responses:
        "200":
          description: Choices recorded with server-owned policy versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberConsentState" }
  /member/referrals:
    get:
      operationId: getMemberReferrals
      responses:
        "200":
          description: The signed-in member's invite code and attributed sign-up count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberReferralSummary" }
        "403":
          description: Current Terms of Use and Privacy Policy consent is required
  /member/referrals/attribute:
    post:
      operationId: attributeMemberReferral
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberReferralAttributionInput" }
      responses:
        "201":
          description: A verified account was attributed once to a valid inviter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberReferralAttributionResponse" }
        "400":
          description: Referral code is invalid or belongs to the signed-in member
        "403":
          description: Verified email and current policy consent are required
        "409":
          description: A referral was already applied to this account
  /member/profile-photo:
    get:
      operationId: getMemberProfilePhoto
      responses:
        "200":
          description: The signed-in member's optional profile photo and recorded consent date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberProfilePhoto" }
    delete:
      operationId: deleteMemberProfilePhoto
      responses:
        "200":
          description: The member's photo was removed; the consent record remains
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberProfilePhoto" }
  /member/profile-photo/upload-url:
    post:
      operationId: requestMemberProfilePhotoUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberProfilePhotoUploadInput" }
      responses:
        "200":
          description: A short-lived upload URL for the signed-in member's private photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberProfilePhotoUploadUrl" }
        "400": { description: Unsupported image type or size }
        "403": { description: Current Terms and Privacy consent is required }
  /member/profile-photo/complete:
    post:
      operationId: completeMemberProfilePhotoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberProfilePhotoCompleteInput" }
      responses:
        "200":
          description: The private image was verified and saved as the member's profile photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberProfilePhoto" }
        "400": { description: The uploaded file is missing or does not match the requested image }
        "403": { description: Current Terms and Privacy consent and explicit photo consent are required }
  /member/profile-photo/file:
    get:
      operationId: getMemberProfilePhotoFile
      responses:
        "200":
          description: The signed-in member's private profile photo
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404": { description: No profile photo is available }
  /attendance/{id}/member-photo:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getAttendanceMemberPhoto
      responses:
        "200":
          description: A member photo shown only to authorized staff for this booking
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404": { description: No photo is available for this authorized booking }
        "403": { description: Attendance access is not permitted }
  /policies:
    get:
      operationId: getPublicLegalPolicies
      responses:
        "200":
          description: Currently effective published policy versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicLegalPolicyVersion" }
  /policies/{policyKey}:
    parameters:
      - name: policyKey
        in: path
        required: true
        schema: { $ref: "#/components/schemas/LegalPolicyKey" }
      - name: version
        in: query
        required: false
        schema: { type: string, minLength: 1, maxLength: 40 }
    get:
      operationId: getPublicLegalPolicyVersion
      responses:
        "200":
          description: A published policy version, current or historical
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicLegalPolicyVersion" }
        "404":
          description: No published version exists for the requested policy
  /member/privacy-requests/{id}/export:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMemberPrivacyRequestExport
      responses:
        "200":
          description: A no-store export for the signed-in member after staff verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDataExport" }
        "401":
          description: Sign-in is required
        "404":
          description: Privacy request not found
        "410":
          description: Export is not ready or its download window expired
  /member/support/tickets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMemberSupportTicket
      responses:
        "200":
          description: Ticket and replies belonging to the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/support/tickets/{id}/replies:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: replyMemberSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportReplyInput" }
      responses:
        "201":
          description: Member reply saved to the owned ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/support/tickets/{id}/attachments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMemberSupportTicketAttachments
      responses:
        "200":
          description: Private, completed attachments on the signed-in member's ticket
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportAttachment" } }
  /member/support/tickets/{id}/attachments/upload-url:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: requestMemberSupportAttachmentUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAttachmentUploadInput" }
      responses:
        "201":
          description: Short-lived upload URL for one private support attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAttachmentUploadResponse" }
  /member/support/tickets/{id}/attachments/{attachmentId}/complete:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeMemberSupportAttachment
      responses:
        "200":
          description: Uploaded file verified and attached to the member's message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAttachment" }
  /member/support/tickets/{id}/attachments/{attachmentId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deletePendingMemberSupportAttachment
      responses:
        "204":
          description: Pending upload removed
  /member/support/tickets/{id}/attachments/{attachmentId}/download:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadMemberSupportAttachment
      responses:
        "200":
          description: Private attachment streamed to its ticket owner
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /member/notifications/settings:
    get:
      operationId: getMemberNotificationSettings
      responses:
        "200":
          description: Signed-in member's push preference and registered device count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    put:
      operationId: updateMemberNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Notification preference updated for the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
  /member/notifications/devices:
    post:
      operationId: registerMemberPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeviceInput" }
      responses:
        "200":
          description: Device registered after explicit member opt-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    delete:
      operationId: unregisterMemberPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeviceRemoval" }
      responses:
        "200":
          description: Device removed and push disabled when no registered devices remain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
  /support/staff/tickets:
    get:
      operationId: getSupportStaffTickets
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/SupportTicketStatus" } }
      responses:
        "200":
          description: Support queue, accessible only to authorized support staff and administrators
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportStaffTicketSummary" } }
  /support/staff/tickets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getSupportStaffTicket
      responses:
        "200":
          description: Staff view of a ticket, its replies, and its status and assignment history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
    patch:
      operationId: updateSupportStaffTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportStaffTicketUpdate" }
      responses:
        "200":
          description: Ticket status or assignment updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
  /support/staff/tickets/{id}/privacy-export:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: prepareSupportStaffPrivacyExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyExportApprovalInput" }
      responses:
        "200":
          description: Export access approved after staff identity verification and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyExportReadyResponse" }
        "403":
          description: Authorized support access is required
        "404":
          description: Privacy request not found
        "409":
          description: Ticket is not a data-copy request or cannot be resolved
  /support/staff/tickets/{id}/replies:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: replySupportStaffTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportReplyInput" }
      responses:
        "201":
          description: Staff reply saved and member notification attempted separately
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
  /support/staff/response-templates:
    get:
      operationId: getSupportStaffResponseTemplates
      responses:
        "200":
          description: Staff-visible multilingual support response templates
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportResponseTemplate" } }
    post:
      operationId: createSupportStaffResponseTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportResponseTemplateInput" }
      responses:
        "201":
          description: Admin-created response template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportResponseTemplate" }
  /support/staff/response-templates/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateSupportStaffResponseTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportResponseTemplateUpdateInput" }
      responses:
        "200":
          description: Updated response template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportResponseTemplate" }
    delete:
      operationId: archiveSupportStaffResponseTemplate
      responses:
        "200":
          description: Template archived for future replies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportResponseTemplate" }
  /support/staff/tickets/{id}/notes:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: addSupportStaffInternalNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportInternalNoteInput" }
      responses:
        "201":
          description: Internal note saved for authorized support staff only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
  /support/staff/tickets/{id}/escalations:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getSupportCaseEscalations
      responses:
        "200":
          description: Staff-only manual case escalation history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportCaseEscalation" } }
    post:
      operationId: createSupportCaseEscalation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportCaseEscalationInput" }
      responses:
        "201":
          description: Case escalated and assigned to the selected staff member
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportCaseEscalation" } }
  /support/staff/tickets/{id}/escalations/{escalationId}/resolve:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: escalationId, in: path, required: true, schema: { type: string } }
    post:
      operationId: resolveSupportCaseEscalation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportCaseResolutionInput" }
      responses:
        "200":
          description: Escalation resolved without closing the member ticket
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportCaseEscalation" } }
  /support/staff/tickets/{id}/related-records:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getSupportStaffTicketRelatedRecords
      responses:
        "200":
          description: Recent bookings and check-ins belonging to the ticket member, with current links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffRelatedRecords" }
  /support/staff/tickets/{id}/links:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: createSupportStaffTicketLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportTicketLinkInput" }
      responses:
        "201":
          description: A member-owned booking or check-in was linked to the support ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffRelatedRecords" }
  /support/staff/tickets/{id}/links/{linkId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: linkId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteSupportStaffTicketLink
      responses:
        "200":
          description: Ticket link removed; refreshed related records returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffRelatedRecords" }
  /support/staff/tickets/{id}/attachments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getSupportStaffTicketAttachments
      responses:
        "200":
          description: Completed private attachments available to authorized support staff
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportAttachment" } }
    post:
      operationId: requestSupportStaffAttachmentUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAttachmentUploadInput" }
      responses:
        "201":
          description: Short-lived upload URL for a private staff reply attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAttachmentUploadResponse" }
  /support/staff/tickets/{id}/attachments/{attachmentId}/complete:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeSupportStaffAttachment
      responses:
        "200":
          description: Staff reply attachment verified and available to the ticket member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAttachment" }
  /support/staff/tickets/{id}/attachments/{attachmentId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deletePendingSupportStaffAttachment
      responses:
        "204": { description: Pending staff reply upload deleted }
  /support/staff/tickets/{id}/attachments/{attachmentId}/download:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadSupportStaffAttachment
      responses:
        "200":
          description: Private attachment streamed to authorized support staff
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /support/staff/agents:
    get:
      operationId: getSupportStaffAgents
      responses:
        "200":
          description: Authorized support team roster
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportAgent" } }
    post:
      operationId: addSupportStaffAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAgentInput" }
      responses:
        "201":
          description: Support role assigned by an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAgent" }
  /support/staff/agents/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 160, pattern: "^[A-Za-z0-9_-]{1,160}$" }
    delete:
      operationId: removeSupportStaffAgent
      responses:
        "200":
          description: Support access revoked immediately; existing tickets remain intact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAgent" }
  /support/staff/agents/{userId}/urgent-alerts:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 160, pattern: "^[A-Za-z0-9_-]{1,160}$" }
    patch:
      operationId: updateSupportStaffAgentUrgentAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAgentUrgentAlertInput" }
      responses:
        "200":
          description: Authorized administrator updated urgent alert eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAgent" }
  /support/staff/urgent-alert-recipient-history:
    get:
      operationId: getSupportUrgentAlertRecipientHistory
      responses:
        "200":
          description: Latest administrator-only urgent alert recipient changes; no device or report data
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportUrgentAlertRecipientAudit" }
  /support/staff/urgent-alert-delivery-outcomes:
    get:
      operationId: getSupportUrgentAlertDeliveryOutcomes
      responses:
        "200":
          description: Latest admin-only per-recipient urgent push outcomes, without device tokens or report content
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportUrgentAlertDeliveryOutcome" }
  /support/staff/access-history:
    get:
      operationId: getSupportStaffAccessHistory
      responses:
        "200":
          description: Latest administrator-only support role grant and removal audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportStaffAccessAuditEvent" }
  /support/staff/notification-failures:
    get:
      operationId: getSupportNotificationFailures
      responses:
        "200":
          description: Recent failed, retrying, and unresolved-receipt push attempts without exposing device tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/NotificationFailure" } }
  /operations:
    get:
      operationId: getOperations
      responses:
        "200":
          description: Authorized staff data, scoped to assigned partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsState" }
  /operations/partner-staff:
