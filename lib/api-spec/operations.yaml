          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MemberLiveClass" } }
  /member/live-classes/{id}/join:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: createLiveClassJoin
      responses:
        "200":
