  /member/courses/{id}/progress:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: updateCourseProgress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseProgressInput" }
      responses:
        "200":
          description: Lesson progress saved to the member account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
  /member/courses/{id}/lessons/{lessonId}/playback-link:
    parameters:
      - { $ref: "#/components/parameters/Id" }
