  /member/waitlist/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      operationId: leaveMemberWaitlist
      responses:
        "200":
          description: Account's waitlist entries after leaving the queue
          content:
            application/json:
              schema: { $ref: "./openapi.yaml#/components/schemas/MemberState" }
  /member/waitlist/{id}/accept:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: acceptMemberWaitlistOffer
      responses:
        "200":
          description: Account state after accepting a place offer
          content:
            application/json:
              schema: { $ref: "./openapi.yaml#/components/schemas/MemberState" }
  /member/plans:
    get:
      operationId: getLivePlans
      responses:
        "200":
          description: Active plans; paid plans are purchasable only when provider checks pass
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LivePlan" } }
  /member/checkout:
    post:
      operationId: createMemberCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberCheckoutInput" }
      responses:
        "200":
          description: Provider-hosted checkout URL; the URL alone never activates access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCheckoutResult" }
  /member/subscription:
    get:
      operationId: getMemberSubscription
      responses:
        "200":
          description: Signed-in member's own paid subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberSubscriptionResponse" }
  /member/subscription/cancel:
    post:
      operationId: cancelMemberSubscription
      responses:
        "200":
          description: Renewal stopped at period end; access remains until then
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCancellationResult" }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
  schemas:
    MemberDevicePlatform:
      type: string
      enum: [ios, android, unknown]
    MemberDeviceStatus:
      type: object
      additionalProperties: false
      required: [status, currentPlatform, pendingActivationAt, pendingPlatform, pendingRiskFlag, waitHours]
      properties:
        status: { type: string, enum: [primary, pending, revoked] }
        currentPlatform: { anyOf: [{ $ref: "#/components/schemas/MemberDevicePlatform" }, { type: "null" }] }
        pendingActivationAt: { type: ["string", "null"], format: date-time }
        pendingPlatform: { anyOf: [{ $ref: "#/components/schemas/MemberDevicePlatform" }, { type: "null" }] }
        pendingRiskFlag: { type: boolean }
        waitHours: { type: integer, const: 24 }
    MemberDeviceRegistration:
      type: object
      additionalProperties: false
      required: [platform]
      properties:
        platform: { type: string, enum: [ios, android] }
    SupportDeviceChange:
      type: object
      additionalProperties: false
      required: [id, userId, requestedAt, activateAt, fromPlatform, toPlatform, riskFlag]
      properties:
        id: { type: string }
        userId: { type: string }
        requestedAt: { type: string, format: date-time }
        activateAt: { type: string, format: date-time }
        fromPlatform: { $ref: "#/components/schemas/MemberDevicePlatform" }
        toPlatform: { $ref: "#/components/schemas/MemberDevicePlatform" }
        riskFlag: { type: boolean }
    DeviceChangeApprovalInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500 }
    SupportDeviceChangeReview:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [support_approved] }
    SupportTicketStatus:
      type: string
      enum: [open, in_progress, waiting_member, resolved, closed]
    SupportTicketCategory:
      type: string
      enum: [booking, account, access, safety, other]
    SupportedLanguage:
      type: string
      enum: [en, ar, ku]
    SupportTicketInput:
      type: object
      additionalProperties: false
      required: [subject, category, message, language]
      properties:
        subject: { type: string, minLength: 4, maxLength: 120 }
        category: { $ref: "#/components/schemas/SupportTicketCategory" }
        message: { type: string, minLength: 10, maxLength: 5000 }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
        urgent: { type: boolean, default: false }
    SupportReplyInput:
      type: object
      additionalProperties: false
      required: [message, language]
      properties:
        message: { type: string, minLength: 1, maxLength: 5000 }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
    SupportTicketSummary:
      type: object
      required: [id, subject, category, urgent, status, language, createdAt, updatedAt, lastMessageAt]
      properties:
        id: { type: string }
        subject: { type: string }
        category: { $ref: "#/components/schemas/SupportTicketCategory" }
        urgent: { type: boolean }
        status: { $ref: "#/components/schemas/SupportTicketStatus" }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }
    SupportTicketEvent:
      type: object
      required: [action, createdAt]
      properties:
        action: { type: string }
        previousStatus: { type: [string, "null"] }
        nextStatus: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    SupportMessage:
      type: object
      required: [id, authorRole, message, language, createdAt]
      properties:
        id: { type: string }
        authorRole: { type: string, enum: [member, support, admin] }
        message: { type: string }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
        createdAt: { type: string, format: date-time }
    SupportAttachment:
      type: object
      required: [id, messageId, fileName, contentType, size, uploaderRole, createdAt]
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        fileName: { type: string }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        uploaderRole: { type: string, enum: [member, support, admin] }
        createdAt: { type: string, format: date-time }
    SupportAttachmentUploadInput:
      type: object
      additionalProperties: false
      required: [messageId, fileName, contentType, size]
      properties:
        messageId: { type: string, format: uuid }
        fileName: { type: string, minLength: 1, maxLength: 180 }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    SupportAttachmentUploadResponse:
      type: object
      required: [id, uploadURL, objectPath]
      properties:
        id: { type: string, format: uuid }
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    SupportTicketDetail:
      allOf:
        - $ref: "#/components/schemas/SupportTicketSummary"
        - type: object
          required: [messages, events]
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/SupportMessage" } }
            events: { type: array, items: { $ref: "#/components/schemas/SupportTicketEvent" } }
