openapi: 3.1.0
info: { title: Operations, version: 1.0.0 }
paths:
  /member/support/tickets:
    get:
      operationId: getMemberSupportTickets
      responses:
        "200":
          description: Tickets owned by the signed-in member
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportTicketSummary" } }
    post:
      operationId: createMemberSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportTicketInput" }
      responses:
        "201":
          description: Private support conversation created for the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/support/tickets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMemberSupportTicket
      responses:
        "200":
          description: Ticket and replies belonging to the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/support/tickets/{id}/replies:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: replyMemberSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportReplyInput" }
      responses:
        "201":
          description: Member reply saved to the owned ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/notifications/settings:
    get:
      operationId: getMemberNotificationSettings
      responses:
        "200":
          description: Signed-in member's push preference and registered device count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    put:
      operationId: updateMemberNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Notification preference updated for the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
  /member/notifications/devices:
    post:
      operationId: registerMemberPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeviceInput" }
      responses:
        "200":
          description: Device registered after explicit member opt-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    delete:
      operationId: unregisterMemberPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeviceRemoval" }
      responses:
        "200":
          description: Device removed and push disabled when no registered devices remain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
  /support/staff/tickets:
    get:
      operationId: getSupportStaffTickets
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/SupportTicketStatus" } }
      responses:
        "200":
          description: Support queue, accessible only to authorized support staff and administrators
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportStaffTicketSummary" } }
  /support/staff/tickets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getSupportStaffTicket
      responses:
        "200":
          description: Staff view of a ticket, its replies, and its status and assignment history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
    patch:
      operationId: updateSupportStaffTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportStaffTicketUpdate" }
      responses:
        "200":
          description: Ticket status or assignment updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
  /support/staff/tickets/{id}/replies:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: replySupportStaffTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportReplyInput" }
      responses:
        "201":
          description: Staff reply saved and member notification attempted separately
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
  /support/staff/agents:
    get:
      operationId: getSupportStaffAgents
      responses:
        "200":
          description: Authorized support team roster
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportAgent" } }
    post:
      operationId: addSupportStaffAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAgentInput" }
      responses:
        "201":
          description: Support role assigned by an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAgent" }
  /support/staff/notification-failures:
    get:
      operationId: getSupportNotificationFailures
      responses:
        "200":
          description: Recent failed operational push attempts without exposing device tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/NotificationFailure" } }
  /operations:
    get:
      operationId: getOperations
      responses:
        "200":
          description: Authorized staff data, scoped to assigned partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsState" }
  /operations/partners:
    post:
      operationId: addPartner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerInput" }
      responses:
        "201":
          description: Unapproved partner created by admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
  /operations/partners/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: approvePartner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerApproval" }
      responses:
        "200":
          description: Approval changed by admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
  /operations/offerings:
    post:
      operationId: addLiveOffering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingInput" }
      responses:
        "201":
          description: Dated live offering created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/offerings/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: changeLiveOffering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingUpdate" }
      responses:
        "200":
          description: Capacity or publishing state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/offerings/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: cancelLiveOffering
      responses:
        "200":
          description: Future session cancelled; reservations released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationSuccess" }
  /operations/courses:
    post:
      operationId: createLearningCourse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "201":
          description: Course content created by an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAdminRecord" }
  /operations/courses/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: updateLearningCourse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseMetadataInput" }
      responses:
        "200":
          description: Course metadata or publishing state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAdminRecord" }
  /operations/courses/{id}/lessons:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: addLearningLesson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonInput" }
      responses:
        "201":
          description: Lesson added to a course
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseLesson" }
  /operations/plans:
    post:
      operationId: addMembershipPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "201":
          description: Plan created by admin; does not activate memberships
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LivePlan" }
  /operations/plans/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: replaceMembershipPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "200":
          description: Plan updated for future grants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LivePlan" }
  /operations/grants:
    post:
      operationId: grantLiveAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessGrantInput" }
      responses:
        "201":
          description: Audited trial or corporate grant; paid plans always rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationSuccess" }
  /operations/revoke:
    post:
      operationId: revokeLiveAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRevokeInput" }
      responses:
        "200":
          description: Live access terminated and active reservations cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationSuccess" }
  /operations/refunds:
    post:
      operationId: requestMembershipRefund
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRequest" }
      responses:
        "200":
          description: Full latest-charge refund result; pending refunds keep access unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundResult" }
  /member/live-catalog:
    get:
      operationId: getLiveCatalog
      responses:
        "200":
          description: Approved partners and future active live offerings only
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LiveOffering" } }
  /member/waitlist:
    get:
      operationId: getMemberWaitlist
      responses:
        "200":
          description: The member's ordered live-class waitlist entries and recent promotions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WaitlistEntry" } }
    post:
      operationId: joinMemberWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitlistJoinInput" }
      responses:
        "201":
          description: The member joins the end of the ordered queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
  /member/waitlist/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      operationId: leaveMemberWaitlist
      responses:
        "200":
          description: The member's active queue entry is withdrawn
          content:
            application/json:
              schema:
                type: object
                required: [left]
                properties:
                  left: { type: boolean }
  /member/courses:
    get:
      operationId: getMemberCourses
      responses:
        "200":
          description: Published course summaries and this member’s server-side progress
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CourseSummary" } }
  /member/courses/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMemberCourse
      responses:
        "200":
          description: Course outline and gated lesson content for the current membership and enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
  /member/courses/{id}/enroll:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: enrollMemberCourse
      responses:
        "200":
          description: Account enrollment saved after live membership checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
  /member/courses/{id}/progress:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: updateCourseProgress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseProgressInput" }
      responses:
        "200":
          description: Lesson progress saved to the member account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
  /member/live-classes:
    get:
      operationId: getMemberLiveClasses
      responses:
        "200":
          description: Approved, future live-class schedules and this member’s booking state without join links
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MemberLiveClass" } }
  /member/live-classes/{id}/join:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: createLiveClassJoin
      responses:
        "200":
          description: Short-lived access details after booking, schedule and membership checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinAccess" }
  /member/plans:
    get:
      operationId: getLivePlans
      responses:
        "200":
          description: Active plans; paid plans are purchasable only when provider checks pass
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LivePlan" } }
  /member/checkout:
    post:
      operationId: createMemberCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberCheckoutInput" }
      responses:
        "200":
          description: Provider-hosted checkout URL; the URL alone never activates access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCheckoutResult" }
  /member/subscription:
    get:
      operationId: getMemberSubscription
      responses:
        "200":
          description: Signed-in member's own paid subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberSubscriptionResponse" }
  /member/subscription/cancel:
    post:
      operationId: cancelMemberSubscription
      responses:
        "200":
          description: Renewal stopped at period end; access remains until then
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCancellationResult" }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
  schemas:
    SupportTicketStatus:
      type: string
      enum: [open, in_progress, waiting_member, resolved, closed]
    SupportTicketCategory:
      type: string
      enum: [booking, account, access, safety, other]
    SupportedLanguage:
      type: string
      enum: [en, ar, ku]
    SupportTicketInput:
      type: object
      additionalProperties: false
      required: [subject, category, message, language]
      properties:
        subject: { type: string, minLength: 4, maxLength: 120 }
        category: { $ref: "#/components/schemas/SupportTicketCategory" }
        message: { type: string, minLength: 10, maxLength: 5000 }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
    SupportReplyInput:
      type: object
      additionalProperties: false
      required: [message, language]
      properties:
        message: { type: string, minLength: 1, maxLength: 5000 }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
    SupportTicketSummary:
      type: object
      required: [id, subject, category, status, language, createdAt, updatedAt, lastMessageAt]
      properties:
        id: { type: string }
        subject: { type: string }
        category: { $ref: "#/components/schemas/SupportTicketCategory" }
        status: { $ref: "#/components/schemas/SupportTicketStatus" }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }
    SupportTicketEvent:
      type: object
      required: [action, createdAt]
      properties:
        action: { type: string }
        previousStatus: { type: [string, "null"] }
        nextStatus: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    SupportMessage:
      type: object
      required: [id, authorRole, message, language, createdAt]
      properties:
        id: { type: string }
        authorRole: { type: string, enum: [member, support, admin] }
        message: { type: string }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
        createdAt: { type: string, format: date-time }
    SupportTicketDetail:
      allOf:
        - $ref: "#/components/schemas/SupportTicketSummary"
        - type: object
          required: [messages, events]
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/SupportMessage" } }
            events: { type: array, items: { $ref: "#/components/schemas/SupportTicketEvent" } }
    SupportStaffTicketSummary:
      allOf:
        - $ref: "#/components/schemas/SupportTicketSummary"
        - type: object
          required: [memberUserId, assignedTo]
          properties:
            memberUserId: { type: string }
            assignedTo: { type: [string, "null"] }
    SupportStaffMessage:
      allOf:
        - $ref: "#/components/schemas/SupportMessage"
        - type: object
          required: [authorId]
          properties: { authorId: { type: string } }
    SupportStaffEvent:
      allOf:
        - $ref: "#/components/schemas/SupportTicketEvent"
        - type: object
          required: [actorId, previousAssignee, nextAssignee, detail]
          properties:
            actorId: { type: string }
            previousAssignee: { type: [string, "null"] }
            nextAssignee: { type: [string, "null"] }
            detail: { type: string }
    SupportStaffTicketDetail:
      allOf:
        - $ref: "#/components/schemas/SupportStaffTicketSummary"
        - type: object
          required: [messages, events]
          properties:
            messages: { type: array, items: { $ref: "#/components/schemas/SupportStaffMessage" } }
            events: { type: array, items: { $ref: "#/components/schemas/SupportStaffEvent" } }
    SupportStaffTicketUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { $ref: "#/components/schemas/SupportTicketStatus" }
        assignedTo:
          anyOf:
            - type: string
            - type: "null"
    SupportAgent:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role: { type: string, enum: [admin, support] }
    SupportAgentInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties: { userId: { type: string, minLength: 1, maxLength: 160 } }
    NotificationSettings:
      type: object
      required: [pushEnabled, language, registeredDevices]
      properties:
        pushEnabled: { type: boolean }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
        registeredDevices: { type: integer, minimum: 0 }
    NotificationSettingsInput:
      type: object
      additionalProperties: false
      required: [pushEnabled, language]
      properties:
        pushEnabled: { type: boolean }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
    PushDeviceInput:
      type: object
      additionalProperties: false
      required: [token, platform, language]
      properties:
        token: { type: string, minLength: 20, maxLength: 512, pattern: "^(Expo|Exponent)PushToken\\[[A-Za-z0-9_-]+\\]$" }
        platform: { type: string, enum: [ios, android] }
        language: { $ref: "#/components/schemas/SupportedLanguage" }
    PushDeviceRemoval:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 512 }
    NotificationFailure:
      type: object
      required: [id, userId, kind, title, status, error, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        kind: { type: string }
        title: { type: string }
        status: { type: string, enum: [failed] }
        error: { type: string }
        createdAt: { type: string, format: date-time }
    OperationSuccess:
      type: object
      required: [ok]
      properties: { ok: { type: boolean } }
    PartnerInput:
      type: object
      additionalProperties: false
      required: [name, groupId, ownerUserId]
      properties:
        name: { type: string }
        groupId: { type: string }
        ownerUserId: { type: string }
    Partner:
      allOf:
        - $ref: "#/components/schemas/PartnerInput"
        - type: object
          required: [id, approved]
          properties: { id: { type: string }, approved: { type: boolean } }
    PartnerApproval:
      type: object
      additionalProperties: false
      required: [approved]
      properties: { approved: { type: boolean } }
    OfferingInput:
      type: object
      required: [partnerId, title, kind, city, facility, category, accessType, tiers, startsAt, endsAt, cancellationDeadline, capacity, active]
      properties:
        partnerId: { type: string }
        title: { type: string }
        localizedTitle:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        localizedDescription:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        joinUrl: { type: ["string", "null"], format: uri }
        kind: { type: string, enum: [session, event, coach] }
        city: { type: string }
        facility: { type: string }
        category: { type: string }
        accessType: { type: string, enum: [physical, premium, live] }
        tiers: { type: array, items: { type: string }, minItems: 1 }
        startsAt: { type: string }
        endsAt: { type: string }
        cancellationDeadline: { type: string }
        capacity: { type: integer, minimum: 1 }
        gender: { type: string, enum: [all, female, male] }
        minAge: { type: integer, minimum: 0 }
        maxAge: { type: [integer, "null"] }
        additionalPayment: { type: boolean }
        active: { type: boolean }
    LiveOffering:
      allOf:
        - $ref: "#/components/schemas/OfferingInput"
        - type: object
          required: [id, targetId, slot, scope]
          properties:
            id: { type: string }
            targetId: { type: string }
            slot: { type: string }
            scope: { type: string }
            cancelledAt: { type: [string, "null"] }
            partnerName: { type: string }
            remaining: { type: integer }
            canJoin: { type: boolean }
    OfferingUpdate:
      type: object
      additionalProperties: false
      required: [capacity]
      properties:
        capacity: { type: integer, minimum: 1 }
        active: { type: boolean }
        localizedTitle: { $ref: "#/components/schemas/LocalizedText" }
        localizedDescription: { $ref: "#/components/schemas/LocalizedText" }
        joinUrl: { type: ["string", "null"], format: uri }
    LocalizedText:
      type: object
      additionalProperties: false
      required: [en, ar, ku]
      properties:
        en: { type: string, minLength: 1, maxLength: 240 }
        ar: { type: string, minLength: 1, maxLength: 240 }
        ku: { type: string, minLength: 1, maxLength: 240 }
    CourseMetadataInput:
      type: object
      additionalProperties: false
      required: [localizedTitle, localizedSummary, localizedInstructor, category, level, durationMinutes, thumbnailUrl, published]
      properties:
        localizedTitle: { $ref: "#/components/schemas/LocalizedText" }
        localizedSummary: { $ref: "#/components/schemas/LocalizedText" }
        localizedInstructor: { $ref: "#/components/schemas/LocalizedText" }
        category: { type: string, minLength: 1, maxLength: 120 }
        level: { type: string, enum: [beginner, intermediate, advanced, all-levels] }
        durationMinutes: { type: integer, minimum: 1, maximum: 10000 }
        thumbnailUrl: { type: ["string", "null"], format: uri }
        published: { type: boolean }
    LessonInput:
      type: object
      additionalProperties: false
      required: [position, localizedTitle, localizedContent, durationMinutes, mediaUrl]
      properties:
        position: { type: integer, minimum: 1 }
        localizedTitle: { $ref: "#/components/schemas/LocalizedText" }
        localizedContent: { $ref: "#/components/schemas/LocalizedText" }
        durationMinutes: { type: integer, minimum: 1, maximum: 1000 }
        mediaUrl: { type: string, format: uri }
    CourseInput:
      allOf:
        - $ref: "#/components/schemas/CourseMetadataInput"
        - type: object
          required: [lessons]
          properties:
            lessons: { type: array, minItems: 1, items: { $ref: "#/components/schemas/LessonInput" } }
    CourseAdminRecord:
      allOf:
        - $ref: "#/components/schemas/CourseMetadataInput"
        - type: object
          required: [id, title, lessonCount, createdAt, updatedAt]
          properties:
            id: { type: string }
            title: { type: string }
            lessonCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CourseSummary:
      allOf:
        - $ref: "#/components/schemas/CourseMetadataInput"
        - type: object
          required: [id, title, lessonCount, enrolled, completedLessons]
          properties:
            id: { type: string }
            title: { type: string }
            lessonCount: { type: integer }
            enrolled: { type: boolean }
            completedLessons: { type: integer }
    CourseLesson:
      type: object
      required: [id, position, localizedTitle, localizedContent, durationMinutes, mediaUrl, completed]
      properties:
        id: { type: string }
        position: { type: integer }
        localizedTitle: { $ref: "#/components/schemas/LocalizedText" }
        localizedContent:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        durationMinutes: { type: integer }
        mediaUrl: { type: ["string", "null"] }
        completed: { type: boolean }
    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          required: [accessState, lessons]
          properties:
            accessState: { type: string, enum: [membership_required, enrollment_required, ready] }
            lessons: { type: array, items: { $ref: "#/components/schemas/CourseLesson" } }
    CourseProgressInput:
      type: object
      additionalProperties: false
      required: [lessonId, completed]
      properties:
        lessonId: { type: string, minLength: 1 }
        completed: { type: boolean }
    WaitlistJoinInput:
      type: object
      additionalProperties: false
      required: [offeringId]
      properties:
        offeringId: { type: string, minLength: 1, maxLength: 120 }
    WaitlistEntry:
      type: object
      required: [id, offeringId, title, localizedTitle, kind, city, facility, startsAt, status, position, joinedAt]
      properties:
        id: { type: string }
        offeringId: { type: string }
        title: { type: string }
        localizedTitle:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        kind: { type: string, enum: [session, event, coach] }
        city: { type: string }
        facility: { type: string }
        startsAt: { type: string, format: date-time }
        status: { type: string, enum: [waiting, promoted, cancelled] }
        position: { type: ["integer", "null"], minimum: 1 }
        joinedAt: { type: string, format: date-time }
    MemberLiveClass:
      type: object
      required: [id, title, localizedTitle, localizedDescription, city, facility, partnerName, startsAt, endsAt, remaining, booked, canJoin]
      properties:
        id: { type: string }
        title: { type: string }
        localizedTitle:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        localizedDescription:
          anyOf:
            - $ref: "#/components/schemas/LocalizedText"
            - type: "null"
        city: { type: string }
        facility: { type: string }
        partnerName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        remaining: { type: integer, minimum: 0 }
        booked: { type: boolean }
        canJoin: { type: boolean }
    JoinAccess:
      type: object
      required: [url, validUntil]
      properties:
        url: { type: string, format: uri }
        validUntil: { type: string, format: date-time }
    EntitlementRules:
      type: object
      additionalProperties: false
      required: [quota, dailyLimit, quotaMode, physicalQuota, premiumQuota, liveQuota]
      properties:
        quota: { type: integer, minimum: 0 }
        dailyLimit: { type: integer, minimum: 0 }
        quotaMode: { type: string, enum: [shared, separate] }
        physicalQuota: { type: integer, minimum: 0 }
        premiumQuota: { type: integer, minimum: 0 }
        liveQuota: { type: integer, minimum: 0 }
        cities: { type: array, items: { type: string } }
        facilities: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        facilityLimits: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        categoryLimits: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        partnerGroupLimits: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        trialAllowedTypes: { type: array, items: { type: string, enum: [physical, premium, live] } }
        corporateId: { type: string }
    PlanInput:
      type: object
      additionalProperties: false
      required: [name, tier, kind, durationDays, active, rules, priceIqd]
      properties:
        name: { type: string }
        tier: { type: string }
        kind: { type: string, enum: [paid, trial, corporate] }
        durationDays: { type: integer, minimum: 1, maximum: 366 }
        active: { type: boolean }
        rules: { $ref: "#/components/schemas/EntitlementRules" }
        priceIqd: { type: [integer, "null"], minimum: 1, maximum: 1000000000 }
    LivePlan:
      allOf:
        - $ref: "#/components/schemas/PlanInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
            purchasable: { type: boolean }
            priceLabel: { type: [string, "null"] }
            availabilityMessage: { type: [string, "null"] }
    MemberCheckoutInput:
      type: object
      additionalProperties: false
      required: [planId]
      properties:
        planId: { type: string, format: uuid }
    MemberCheckoutResult:
      type: object
      required: [purchaseUrl]
      properties: { purchaseUrl: { type: string, format: uri } }
    MemberSubscriptionResponse:
      oneOf:
        - type: "null"
        - type: object
          required: [status, paymentStatus, cancelAtPeriodEnd, periodEndsAt, recoveryUrl]
          properties:
            status: { type: string }
            paymentStatus: { type: string }
            cancelAtPeriodEnd: { type: boolean }
            periodEndsAt: { type: [string, "null"], format: date-time }
            recoveryUrl: { type: [string, "null"], format: uri }
            refundStatus: { type: string }
    MemberCancellationResult:
      type: object
      required: [cancelAtPeriodEnd, periodEndsAt]
      properties:
        cancelAtPeriodEnd: { type: boolean }
        periodEndsAt: { type: [string, "null"], format: date-time }
    RefundRequest:
      type: object
      additionalProperties: false
      required: [userId, reason]
      properties:
        userId: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 5, maxLength: 500 }
    RefundResult:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [completed, pending] } }
    AccessRevokeInput:
      type: object
      required: [userId, reason]
      properties: { userId: { type: string }, reason: { type: string, minLength: 5 } }
    AccessGrantInput:
      allOf:
        - $ref: "#/components/schemas/AccessRevokeInput"
        - type: object
          required: [planId]
          properties: { planId: { type: string }, corporateId: { type: string } }
    OperationsState:
      type: object
      required: [role, partnerId, partners, offerings, plans]
      properties:
        role: { type: string, enum: [admin, partner] }
        partnerId: { type: [string, "null"] }
        partners: { type: array, items: { $ref: "#/components/schemas/Partner" } }
        offerings: { type: array, items: { $ref: "#/components/schemas/LiveOffering" } }
        plans: { type: array, items: { $ref: "#/components/schemas/LivePlan" } }
