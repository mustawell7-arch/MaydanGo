            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
  /member/courses/{id}/enroll:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: enrollMemberCourse
      responses:
        "200":
          description: Account enrollment saved after live membership checks
