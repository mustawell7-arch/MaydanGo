openapi: 3.1.0
info: { title: Operations, version: 1.0.0 }
paths:
  /member/device:
    get:
      operationId: getMemberDeviceStatus
      responses:
        "200":
          description: Current installation status and any active 24-hour change request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDeviceStatus" }
    post:
      operationId: registerMemberDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberDeviceRegistration" }
      responses:
        "200":
          description: Current installation status after registration or change request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDeviceStatus" }
  /member/device/change:
    delete:
      operationId: cancelMemberDeviceChange
      responses:
        "200":
          description: Pending device change cancelled by the active primary installation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberDeviceStatus" }
  /support/staff/device-changes:
    get:
      operationId: getSupportPendingDeviceChanges
      responses:
        "200":
          description: Pending device changes for authorized support staff
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportDeviceChange" }
  /support/staff/device-changes/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: approveSupportDeviceChange
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceChangeApprovalInput" }
      responses:
        "200":
          description: Pending change approved early and recorded for audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportDeviceChangeReview" }
  /member/support/tickets:
    get:
      operationId: getMemberSupportTickets
      responses:
        "200":
          description: Tickets owned by the signed-in member
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportTicketSummary" } }
    post:
      operationId: createMemberSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportTicketInput" }
      responses:
        "201":
          description: Private support conversation created for the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/support/tickets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMemberSupportTicket
      responses:
        "200":
          description: Ticket and replies belonging to the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/support/tickets/{id}/replies:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: replyMemberSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportReplyInput" }
      responses:
        "201":
          description: Member reply saved to the owned ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
  /member/support/tickets/{id}/attachments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMemberSupportTicketAttachments
      responses:
        "200":
          description: Private, completed attachments on the signed-in member's ticket
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportAttachment" } }
  /member/support/tickets/{id}/attachments/upload-url:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: requestMemberSupportAttachmentUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAttachmentUploadInput" }
      responses:
        "201":
          description: Short-lived upload URL for one private support attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAttachmentUploadResponse" }
  /member/support/tickets/{id}/attachments/{attachmentId}/complete:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeMemberSupportAttachment
      responses:
        "200":
          description: Uploaded file verified and attached to the member's message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAttachment" }
  /member/support/tickets/{id}/attachments/{attachmentId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deletePendingMemberSupportAttachment
      responses:
        "204":
          description: Pending upload removed
  /member/support/tickets/{id}/attachments/{attachmentId}/download:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadMemberSupportAttachment
      responses:
        "200":
          description: Private attachment streamed to its ticket owner
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /member/notifications/settings:
    get:
      operationId: getMemberNotificationSettings
      responses:
        "200":
          description: Signed-in member's push preference and registered device count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    put:
      operationId: updateMemberNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsInput" }
      responses:
        "200":
          description: Notification preference updated for the signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
  /member/notifications/devices:
    post:
      operationId: registerMemberPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeviceInput" }
      responses:
        "200":
          description: Device registered after explicit member opt-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
    delete:
      operationId: unregisterMemberPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeviceRemoval" }
      responses:
        "200":
          description: Device removed and push disabled when no registered devices remain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
  /support/staff/tickets:
    get:
      operationId: getSupportStaffTickets
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/SupportTicketStatus" } }
      responses:
        "200":
          description: Support queue, accessible only to authorized support staff and administrators
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportStaffTicketSummary" } }
  /support/staff/tickets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getSupportStaffTicket
      responses:
        "200":
          description: Staff view of a ticket, its replies, and its status and assignment history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
    patch:
      operationId: updateSupportStaffTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportStaffTicketUpdate" }
      responses:
        "200":
          description: Ticket status or assignment updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
  /support/staff/tickets/{id}/replies:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: replySupportStaffTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportReplyInput" }
      responses:
        "201":
          description: Staff reply saved and member notification attempted separately
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportStaffTicketDetail" }
  /support/staff/tickets/{id}/attachments:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getSupportStaffTicketAttachments
      responses:
        "200":
          description: Completed private attachments available to authorized support staff
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportAttachment" } }
  /support/staff/tickets/{id}/attachments/{attachmentId}/download:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadSupportStaffAttachment
      responses:
        "200":
          description: Private attachment streamed to authorized support staff
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /support/staff/agents:
    get:
      operationId: getSupportStaffAgents
      responses:
        "200":
          description: Authorized support team roster
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SupportAgent" } }
    post:
      operationId: addSupportStaffAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAgentInput" }
      responses:
        "201":
          description: Support role assigned by an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAgent" }
  /support/staff/agents/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 160, pattern: "^[A-Za-z0-9_-]{1,160}$" }
    delete:
      operationId: removeSupportStaffAgent
      responses:
        "200":
          description: Support access revoked immediately; existing tickets remain intact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAgent" }
  /support/staff/agents/{userId}/urgent-alerts:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 160, pattern: "^[A-Za-z0-9_-]{1,160}$" }
    patch:
      operationId: updateSupportStaffAgentUrgentAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAgentUrgentAlertInput" }
      responses:
        "200":
          description: Authorized administrator updated urgent alert eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAgent" }
  /support/staff/urgent-alert-recipient-history:
    get:
      operationId: getSupportUrgentAlertRecipientHistory
      responses:
        "200":
          description: Latest administrator-only urgent alert recipient changes; no device or report data
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportUrgentAlertRecipientAudit" }
  /support/staff/urgent-alert-delivery-outcomes:
    get:
      operationId: getSupportUrgentAlertDeliveryOutcomes
      responses:
        "200":
          description: Latest admin-only per-recipient urgent push outcomes, without device tokens or report content
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportUrgentAlertDeliveryOutcome" }
  /support/staff/access-history:
    get:
      operationId: getSupportStaffAccessHistory
      responses:
        "200":
          description: Latest administrator-only support role grant and removal audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportStaffAccessAuditEvent" }
  /support/staff/notification-failures:
    get:
      operationId: getSupportNotificationFailures
      responses:
        "200":
          description: Recent failed, retrying, and unresolved-receipt push attempts without exposing device tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/NotificationFailure" } }
  /operations:
    get:
      operationId: getOperations
      responses:
        "200":
          description: Authorized staff data, scoped to assigned partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsState" }
  /operations/quality:
    get:
      operationId: getFacilityQualityControl
      responses:
        "200":
          description: Facility quality history and incident reports within the operator's authorized partner scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityQualityControl" }
  /operations/quality/assessments:
    post:
      operationId: createFacilityQualityAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilityQualityAssessmentInput" }
      responses:
        "201":
          description: New quality assessment recorded and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityQualityAssessment" }
        "400": { description: "Invalid quality checklist, dates, or corrective-action information" }
        "403": { description: Only authorized administrators can create inspections }
        "404": { description: Facility not found }
  /operations/quality/assessments/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateFacilityQualityAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilityQualityAssessmentFollowUp" }
      responses:
        "200":
          description: Assessment follow-up updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityQualityAssessment" }
        "400": { description: Invalid status or corrective action }
        "404": { description: Assessment not found }
  /operations/quality/incidents:
    post:
      operationId: createFacilityQualityIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilityQualityIncidentInput" }
      responses:
        "201":
          description: Facility incident report submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityQualityIncident" }
        "400": { description: Invalid incident details }
        "404": { description: Facility not found }
  /operations/quality/incidents/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateFacilityQualityIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilityQualityIncidentUpdate" }
      responses:
        "200":
          description: Incident review status updated and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityQualityIncident" }
        "400": { description: Invalid incident status or resolution }
        "404": { description: Incident not found }
  /operations/reviews:
    get:
      operationId: getOperationsFacilityReviews
      responses:
        "200":
          description: Facility reviews and reported content visible to the signed-in operator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsFacilityReviews" }
        "403": { description: Administrator or approved partner access is required }
  /operations/reviews/{id}/moderation:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: moderateFacilityReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilityReviewModerationInput" }
      responses:
        "200":
          description: Review moderation decision saved and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsFacilityReview" }
        "400": { description: Invalid moderation decision }
        "403": { description: Administrator access is required }
        "404": { description: Review not found }
  /operations/reviews/{id}/response:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: respondToFacilityReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilityReviewResponseInput" }
      responses:
        "200":
          description: Partner response saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsFacilityReview" }
        "400": { description: Invalid partner response }
        "403": { description: The review is not owned by this partner }
        "404": { description: Review not found }
  /operations/review-privileges/{userId}:
    put:
      operationId: setFacilityReviewPrivilege
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilityReviewPrivilegeInput" }
      responses:
        "200":
          description: Review privilege decision saved and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityReviewPrivilege" }
        "400": { description: Invalid privilege decision }
        "403": { description: Administrator access is required }
  /operations/partners:
    post:
      operationId: addPartner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerInput" }
      responses:
        "201":
          description: Unapproved partner created by admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
  /operations/marketing-profile:
    get:
      operationId: getPartnerMarketingProfile
      responses:
        "200":
          description: Authenticated partner's marketing profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerMarketingProfile" }
        "403": { description: An approved partner account is required }
    put:
      operationId: updatePartnerMarketingProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerMarketingProfileUpdate" }
      responses:
        "200":
          description: Partner marketing profile updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerMarketingProfile" }
        "400": { description: Invalid logo URL }
        "403": { description: An approved partner account is required }
  /operations/analytics:
    get:
      operationId: getOperationsAnalytics
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Aggregated operations metrics scoped to the administrator or partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsAnalyticsResponse" }
        "400": { description: Invalid or overlong date range }
        "403": { description: Administrator or approved partner access is required }
  /operations/partners/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: approvePartner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerApproval" }
      responses:
        "200":
          description: Approval changed by admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partner" }
  /operations/offerings:
    post:
      operationId: addLiveOffering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingInput" }
      responses:
        "201":
          description: Dated live offering created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/offerings/recurring:
    post:
      operationId: createRecurringOfferings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringOfferingsInput" }
      responses:
        "201":
          description: Individually bookable future sessions created as one atomic batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringOfferingsResponse" }
        "409":
          description: The entire batch was rejected because one or more Baghdad dates overlap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringOfferingConflict" }
  /operations/offerings/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: changeLiveOffering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingUpdate" }
      responses:
        "200":
          description: Capacity or publishing state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/offerings/{id}/waitlist:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getOfferingWaitlist
      responses:
        "200":
          description: Ordered waitlist and current offer state for an authorized partner offering
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OfferingWaitlistEntry" } }
  /operations/offerings/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: cancelLiveOffering
      responses:
        "200":
          description: Future session cancelled; reservations released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationSuccess" }
  /operations/offerings/{id}/series:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: changeRecurringOfferingSeries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingUpdate" }
      responses:
        "200":
          description: Future sessions in the recurring series updated atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringOfferingsResponse" }
  /operations/offerings/{id}/series/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: cancelRecurringOfferingSeries
      responses:
        "200":
          description: Unbooked future sessions cancelled and sessions with bookings or attendance preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelRecurringOfferingSeriesResponse" }
  /operations/offerings/{id}/submit:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: submitLiveOffering
      responses:
        "200":
          description: Partner submitted its own draft activity for administrator review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/offerings/{id}/respond:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: respondToOfferingCorrection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingPartnerResponse" }
      responses:
        "200":
          description: Partner response saved and activity resubmitted for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/offerings/{id}/review:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: reviewOfferingApproval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingReviewInput" }
      responses:
        "200":
          description: Administrator decision saved and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveOffering" }
  /operations/bookings/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: cancelAdminBooking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingCancellationRequest" }
      responses:
        "200":
          description: Future active booking cancelled, waitlist queue processed, and action audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationSuccess" }
  /operations/courses:
    get:
      operationId: getOperationCourses
      responses:
        "200":
          description: All courses and lesson counts available to administrators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GetOperationCoursesResponse" }
    post:
      operationId: createLearningCourse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "201":
          description: Course content created by an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAdminRecord" }
  /operations/courses/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: updateLearningCourse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseMetadataInput" }
      responses:
        "200":
          description: Course metadata or publishing state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAdminRecord" }
  /operations/courses/{id}/lessons:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: addLearningLesson
      requestBody:
