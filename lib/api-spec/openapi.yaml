      properties:
        id: { type: string }
        partnerId: { type: string }
        city: { type: string }
        facility: { type: string }
        localizedName: { $ref: "#/components/schemas/LocalizedFacilityText" }
        localizedDistrict: { $ref: "#/components/schemas/LocalizedFacilityText" }
        localizedAddress: { $ref: "#/components/schemas/LocalizedFacilityText" }
        localizedDescription: { $ref: "#/components/schemas/LocalizedFacilityText" }
        activities: { type: array, items: { $ref: "#/components/schemas/LocalizedFacilityText" } }
        amenities: { type: array, items: { $ref: "#/components/schemas/LocalizedFacilityText" } }
        accessibility: { type: array, items: { $ref: "#/components/schemas/LocalizedFacilityText" } }
        openingHours: { type: array, items: { $ref: "#/components/schemas/FacilityOpeningDay" } }
        contactPhone: { type: ["string", "null"] }
        websiteUrl: { type: ["string", "null"], format: uri }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        updatedAt: { type: string, format: date-time }
