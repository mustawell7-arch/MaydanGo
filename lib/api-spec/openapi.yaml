openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /public/catalog:
    get:
      operationId: getPublicCatalog
      responses:
        "200":
          description: Future offerings from active, approved live partners only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicOffering"
  /public/plans:
    get:
      operationId: getPublicPlans
      responses:
        "200":
          description: Active membership plan details for information only; no payment or activation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicPlan"
  /attendance:
    get:
      operationId: getAttendance
      responses:
        "200":
          description: Own reservation attendance or authorized partner roster, with audit notifications
          content:
            application/json:
              schema:
                type: object
                required: [role, rows]
                properties:
                  role: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      required: [reservationId, userId, title, facility, startsAt, endsAt, bookingStatus, status, settlementEligible, locked, events]
                      properties:
                        reservationId: { type: string }
                        userId: { type: string }
                        title: { type: string }
                        facility: { type: string }
                        startsAt: { type: string }
                        endsAt: { type: string }
                        bookingStatus: { type: string }
                        status: { type: string }
                        settlementEligible: { type: boolean }
                        locked: { type: boolean }
                        reference: { type: string }
                        checkedInAt: { type: string }
                        policy:
                          $ref: "#/components/schemas/CheckinPolicy"
                        events:
                          type: array
                          items:
                            type: object
                            required: [action, reason, createdAt, actorId]
                            properties:
                              action: { type: string }
                              reason: { type: string }
                              createdAt: { type: string }
                              actorId: { type: string }
  /attendance/{id}/policy:
    put:
      operationId: setCheckinPolicy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinPolicy"
      responses:
        "200": { description: Policy saved }
  /attendance/{id}/qr:
    post:
      operationId: issueCheckinQr
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Single-use QR; replaces all previous codes for this reservation
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: string }
    delete:
      operationId: revokeCheckinQr
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: QR deactivated }
  /attendance/scan:
    post:
      operationId: scanCheckinQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, latitude, longitude, accuracy, capturedAt]
              properties:
                token: { type: string }
                latitude: { type: number }
                longitude: { type: number }
                accuracy: { type: number }
                capturedAt: { type: string }
                mocked: { type: boolean }
      responses:
        "200":
          description: Arrival recorded, awaiting partner confirmation
          content:
            application/json:
              schema:
                type: object
                required: [reference, status]
                properties:
                  reference: { type: string }
                  status: { type: string }
  /attendance/{id}/manual-code:
    post:
      operationId: requestManualCheckinCode
      summary: Request a short-lived code for the reservation owner
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Single-use code, valid for up to five minutes
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt]
                properties:
                  code: { type: string, pattern: "^\\d{8}$" }
                  expiresAt: { type: string }
  /attendance/{id}/manual:
    post:
      operationId: recordManualCheckin
      summary: Record a staff-assisted arrival after one-time code verification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, reason]
              properties:
                code: { type: string, pattern: "^\\d{8}$" }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200":
          description: Arrival recorded as pending; another staff member must confirm
          content:
            application/json:
              schema:
                type: object
                required: [ok, reference, status]
                properties:
                  ok: { type: boolean }
                  reference: { type: string }
                  status: { type: string, enum: [pending] }
  /attendance/{id}/review:
    post:
      operationId: reviewAttendance
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [confirm, no_show, dispute, void, resolve_confirm, resolve_void, accept_request, lock] }
                reason: { type: string }
      responses:
        "200": { description: Audited review saved }
  /operations:
    $ref: "./operations.yaml#/paths/~1operations"
  /operations/partners:
    $ref: "./operations.yaml#/paths/~1operations~1partners"
  /operations/partners/{id}:
    $ref: "./operations.yaml#/paths/~1operations~1partners~1{id}"
  /operations/offerings:
    $ref: "./operations.yaml#/paths/~1operations~1offerings"
  /operations/offerings/{id}:
    $ref: "./operations.yaml#/paths/~1operations~1offerings~1{id}"
  /operations/offerings/{id}/cancel:
    $ref: "./operations.yaml#/paths/~1operations~1offerings~1{id}~1cancel"
  /operations/courses:
    $ref: "./operations.yaml#/paths/~1operations~1courses"
  /operations/courses/{id}:
    $ref: "./operations.yaml#/paths/~1operations~1courses~1{id}"
  /operations/courses/{id}/lessons:
    $ref: "./operations.yaml#/paths/~1operations~1courses~1{id}~1lessons"
  /operations/plans:
    $ref: "./operations.yaml#/paths/~1operations~1plans"
  /operations/plans/{id}:
    $ref: "./operations.yaml#/paths/~1operations~1plans~1{id}"
  /operations/grants:
    $ref: "./operations.yaml#/paths/~1operations~1grants"
  /operations/revoke:
    $ref: "./operations.yaml#/paths/~1operations~1revoke"
  /operations/refunds:
    $ref: "./operations.yaml#/paths/~1operations~1refunds"
  /member/live-catalog:
    $ref: "./operations.yaml#/paths/~1member~1live-catalog"
  /member/courses:
    $ref: "./operations.yaml#/paths/~1member~1courses"
  /member/courses/{id}:
    $ref: "./operations.yaml#/paths/~1member~1courses~1{id}"
  /member/courses/{id}/enroll:
    $ref: "./operations.yaml#/paths/~1member~1courses~1{id}~1enroll"
  /member/courses/{id}/progress:
    $ref: "./operations.yaml#/paths/~1member~1courses~1{id}~1progress"
  /member/live-classes:
    $ref: "./operations.yaml#/paths/~1member~1live-classes"
  /member/live-classes/{id}/join:
    $ref: "./operations.yaml#/paths/~1member~1live-classes~1{id}~1join"
  /member/support/tickets:
    $ref: "./operations.yaml#/paths/~1member~1support~1tickets"
  /member/support/tickets/{id}:
    $ref: "./operations.yaml#/paths/~1member~1support~1tickets~1{id}"
  /member/support/tickets/{id}/replies:
    $ref: "./operations.yaml#/paths/~1member~1support~1tickets~1{id}~1replies"
  /member/notifications/settings:
    $ref: "./operations.yaml#/paths/~1member~1notifications~1settings"
  /member/notifications/devices:
    $ref: "./operations.yaml#/paths/~1member~1notifications~1devices"
  /support/staff/tickets:
    $ref: "./operations.yaml#/paths/~1support~1staff~1tickets"
  /support/staff/tickets/{id}:
    $ref: "./operations.yaml#/paths/~1support~1staff~1tickets~1{id}"
  /support/staff/tickets/{id}/replies:
    $ref: "./operations.yaml#/paths/~1support~1staff~1tickets~1{id}~1replies"
  /support/staff/agents:
    $ref: "./operations.yaml#/paths/~1support~1staff~1agents"
  /support/staff/notification-failures:
    $ref: "./operations.yaml#/paths/~1support~1staff~1notification-failures"
  /member/plans:
    $ref: "./operations.yaml#/paths/~1member~1plans"
  /member/checkout:
    $ref: "./operations.yaml#/paths/~1member~1checkout"
  /member/subscription:
    $ref: "./operations.yaml#/paths/~1member~1subscription"
  /member/subscription/cancel:
    $ref: "./operations.yaml#/paths/~1member~1subscription~1cancel"
  /member/profile:
    put:
      operationId: saveMemberProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gender, birthDate]
              properties:
                gender: { type: string, enum: [female, male, unspecified] }
                birthDate: { type: string }
      responses:
        "200":
          description: Eligibility profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberState"
  /member/catalog:
    get:
      operationId: getBookingCatalog
      responses:
        "200":
          description: Server dates and available places
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, kind, targetId, slot, title, startsAt, cancellationDeadline, scope, remaining]
                  properties:
                    id: { type: string }
                    kind: { type: string }
                    targetId: { type: string }
                    slot: { type: string }
                    title: { type: string }
                    startsAt: { type: string }
                    cancellationDeadline: { type: string }
                    scope: { type: string }
                    remaining: { type: integer }
  /member:
    get:
      operationId: getMemberState
      responses:
        "200":
          description: Account-owned membership and reservations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberState"
  /member/preview-membership:
    post:
      operationId: enablePreviewMembership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledgeSampleData]
              properties:
                acknowledgeSampleData:
                  type: boolean
      responses:
        "200":
          description: Preview membership only; never live access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberState"
  /member/bookings:
    post:
      operationId: createMemberBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, targetId]
              properties:
                kind:
                  type: string
                  enum: [session, event, coach]
                targetId:
                  type: string
                slot:
                  type: string
      responses:
        "201":
          description: Reservation saved, not attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberState"
  /member/bookings/{id}:
    delete:
      operationId: cancelMemberBooking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Owner's reservation cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberState"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    PublicOffering:
      type: object
      required: [id, kind, title, city, facility, category, accessType, startsAt, endsAt, remaining, partnerName]
      properties:
        id: { type: string }
        kind: { type: string, enum: [session, event, coach] }
        title: { type: string }
        city: { type: string }
        facility: { type: string }
        category: { type: string }
        accessType: { type: string, enum: [physical, premium, live] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        remaining: { type: integer, minimum: 0 }
        partnerName: { type: string }
    PublicPlan:
      type: object
      required: [id, name, tier, kind, durationDays]
      properties:
        id: { type: string }
        name: { type: string }
        tier: { type: string }
        kind: { type: string, enum: [paid, trial, corporate] }
        durationDays: { type: integer, minimum: 1 }
    CheckinPolicy:
      type: object
      required: [latitude, longitude, radius, opensAt, closesAt, correctionEndsAt]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        radius: { type: integer }
        opensAt: { type: string }
        closesAt: { type: string }
        correctionEndsAt: { type: string }
    MemberState:
      type: object
      required: [memberships, bookings]
      properties:
        profile:
          type: [object, "null"]
          required: [gender, birthDate]
          properties:
            gender: { type: string }
            birthDate: { type: string }
        memberships:
          type: array
          items:
            type: object
            required: [scope, status, tier, endsAt]
            properties:
              scope: { type: string }
              source: { type: string }
              status: { type: string }
              tier: { type: string }
              endsAt: { type: string }
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/MemberBooking"
    MemberBooking:
      type: object
      required: [id, kind, targetId, slot, title, scope, startsAt, status, createdAt]
      properties:
        id: { type: string }
        kind: { type: string }
        targetId: { type: string }
        slot: { type: string }
        title: { type: string }
        scope: { type: string }
        startsAt: { type: string }
        status: { type: string }
        createdAt: { type: string }
        cancelledAt: { type: [string, "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

