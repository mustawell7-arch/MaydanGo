        endDate: { type: string, format: date, description: Inclusive calendar date in Asia/Baghdad }
        closed: { type: boolean }
        opensAt: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: 24-hour local facility time }
        closesAt: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: 24-hour local facility time }
        localizedReason: { $ref: "#/components/schemas/LocalizedFacilityText" }
    FacilityHoursOverride:
      type: object
      required: [id, facilityId, startDate, endDate, closed, opensAt, closesAt, localizedReason, createdAt]
      properties:
        id: { type: string }
        facilityId: { type: string }
        startDate: { type: string, format: date, description: Inclusive calendar date in Asia/Baghdad }
        endDate: { type: string, format: date, description: Inclusive calendar date in Asia/Baghdad }
        closed: { type: boolean }
        opensAt: { type: ["string", "null"] }
        closesAt: { type: ["string", "null"] }
        localizedReason: { $ref: "#/components/schemas/LocalizedFacilityText" }
        createdAt: { type: string, format: date-time }
