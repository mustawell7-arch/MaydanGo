openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /public/facilities:
    get:
      operationId: getPublicFacilities
      responses:
        "200":
          description: Facility details published by approved partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicFacility"
  /public/facilities/{id}:
    get:
      operationId: getPublicFacility
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: A published facility profile and future live sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFacility"
        "404": { description: Facility not found }
  /operations/facilities:
    get:
      operationId: getOperationFacilities
      responses:
        "200":
          description: Facility profiles visible to the signed-in operator
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsFacility"
    post:
      operationId: createFacilityProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityProfileInput"
      responses:
        "201":
          description: Facility profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityProfile"
  /operations/facilities/{id}:
    put:
      operationId: updateFacilityProfile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityProfileUpdate"
      responses:
        "200":
          description: Facility profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityProfile"
        "404": { description: Facility not found }
    delete:
      operationId: deleteFacilityProfile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Facility profile removed }
        "404": { description: Facility not found }
  /operations/facilities/{id}/hours-overrides:
    post:
      operationId: createFacilityHoursOverride
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityHoursOverrideInput"
      responses:
        "201":
          description: Date-bounded facility hours override created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityHoursOverride"
        "404": { description: Facility not found }
        "400": { description: "Invalid dates, times, or localized reason" }
        "409": { description: The dates overlap another hours override }
  /operations/facilities/{id}/hours-overrides/{overrideId}:
    delete:
      operationId: deleteFacilityHoursOverride
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: overrideId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Facility hours override removed }
        "404": { description: Facility or override not found }
  /public/catalog:
    get:
      operationId: getPublicCatalog
      responses:
        "200":
          description: Future offerings from active, approved live partners only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicOffering"
  /public/plans:
    get:
      operationId: getPublicPlans
      responses:
        "200":
          description: Active membership plan details for information only; no payment or activation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicPlan"
  /attendance:
    get:
      operationId: getAttendance
      responses:
        "200":
          description: Own reservation attendance or authorized partner roster, with audit notifications
          content:
            application/json:
              schema:
                type: object
                required: [role, rows]
                properties:
                  role: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      required: [reservationId, userId, title, facility, startsAt, endsAt, bookingStatus, status, settlementEligible, manualCheckin, manualRepeatUse, locked, events]
                      properties:
                        reservationId: { type: string }
                        userId: { type: string }
                        title: { type: string }
                        facility: { type: string }
                        startsAt: { type: string }
                        endsAt: { type: string }
                        bookingStatus: { type: string }
                        status: { type: string }
                        settlementEligible: { type: boolean }
                        manualCheckin: { type: boolean, description: True when this reservation has a staff-assisted arrival audit event }
                        manualRepeatUse: { type: boolean, description: True after the member has more than one staff-assisted arrival }
                        locked: { type: boolean }
                        reference: { type: string }
                        checkedInAt: { type: string }
                        policy:
                          $ref: "#/components/schemas/CheckinPolicy"
                        events:
                          type: array
                          items:
                            type: object
                            required: [action, reason, createdAt, actorId]
                            properties:
                              action: { type: string }
                              reason: { type: string }
                              createdAt: { type: string }
                              actorId: { type: string }
  /attendance/{id}/policy:
    put:
      operationId: setCheckinPolicy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinPolicy"
      responses:
        "200": { description: Policy saved }
  /attendance/{id}/qr:
    post:
      operationId: issueCheckinQr
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Single-use QR; replaces all previous codes for this reservation
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: string }
    delete:
      operationId: revokeCheckinQr
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: QR deactivated }
  /attendance/scan:
    post:
      operationId: scanCheckinQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, latitude, longitude, accuracy, capturedAt]
              properties:
                token: { type: string }
                latitude: { type: number }
                longitude: { type: number }
                accuracy: { type: number }
                capturedAt: { type: string }
                mocked: { type: boolean }
      responses:
        "200":
          description: Arrival recorded, awaiting partner confirmation
          content:
            application/json:
              schema:
                type: object
                required: [reference, status]
                properties:
                  reference: { type: string }
                  status: { type: string }
  /attendance/{id}/manual-code:
    post:
      operationId: requestManualCheckinCode
      summary: Request a short-lived code for the reservation owner
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Single-use code, valid for up to five minutes
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt]
                properties:
                  code: { type: string, pattern: "^\\d{8}$" }
                  expiresAt: { type: string }
  /attendance/{id}/manual:
    post:
      operationId: recordManualCheckin
      summary: Record a staff-assisted arrival after one-time code verification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, reason]
              properties:
                code: { type: string, pattern: "^\\d{8}$" }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200":
          description: Arrival recorded as pending; another staff member must confirm
          content:
            application/json:
              schema:
                type: object
                required: [ok, reference, status]
                properties:
                  ok: { type: boolean }
                  reference: { type: string }
                  status: { type: string, enum: [pending] }
  /attendance/{id}/review:
    post:
      operationId: reviewAttendance
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [confirm, no_show, dispute, void, resolve_confirm, resolve_void, accept_request, reject_request, lock] }
                reason: { type: string }
      responses:
        "200": { description: Audited review saved }
  /operations:
    $ref: "./operations.yaml#/paths/~1operations"
  /operations/partners:
    $ref: "./operations.yaml#/paths/~1operations~1partners"
  /operations/partners/{id}:
    $ref: "./operations.yaml#/paths/~1operations~1partners~1{id}"
  /operations/offerings:
    $ref: "./operations.yaml#/paths/~1operations~1offerings"
  /operations/offerings/recurring:
    $ref: "./operations.yaml#/paths/~1operations~1offerings~1recurring"
  /operations/offerings/{id}:
    $ref: "./operations.yaml#/paths/~1operations~1offerings~1{id}"
  /operations/offerings/{id}/waitlist:
    $ref: "./operations.yaml#/paths/~1operations~1offerings~1{id}~1waitlist"
  /operations/offerings/{id}/cancel:
    $ref: "./operations.yaml#/paths/~1operations~1offerings~1{id}~1cancel"
  /operations/offerings/{id}/series:
    $ref: "./operations.yaml#/paths/~1operations~1offerings~1{id}~1series"
  /operations/offerings/{id}/series/cancel:
    $ref: "./operations.yaml#/paths/~1operations~1offerings~1{id}~1series~1cancel"
  /operations/offerings/{id}/submit:
    $ref: "./operations.yaml#/paths/~1operations~1offerings~1{id}~1submit"
  /operations/offerings/{id}/respond:
    $ref: "./operations.yaml#/paths/~1operations~1offerings~1{id}~1respond"
  /operations/offerings/{id}/review:
    $ref: "./operations.yaml#/paths/~1operations~1offerings~1{id}~1review"
  /operations/bookings/{id}/cancel:
    $ref: "./operations.yaml#/paths/~1operations~1bookings~1{id}~1cancel"
  /operations/settlements:
    $ref: "./operations.yaml#/paths/~1operations~1settlements"
  /operations/invoices:
    $ref: "./operations.yaml#/paths/~1operations~1invoices"
  /operations/invoices/upload-url:
    $ref: "./operations.yaml#/paths/~1operations~1invoices~1upload-url"
  /operations/invoices/{id}/document:
    $ref: "./operations.yaml#/paths/~1operations~1invoices~1{id}~1document"
  /operations/courses:
    $ref: "./operations.yaml#/paths/~1operations~1courses"
  /operations/courses/{id}:
    $ref: "./operations.yaml#/paths/~1operations~1courses~1{id}"
  /operations/courses/{id}/lessons:
    $ref: "./operations.yaml#/paths/~1operations~1courses~1{id}~1lessons"
  /operations/plans:
    $ref: "./operations.yaml#/paths/~1operations~1plans"
  /operations/plans/{id}:
    $ref: "./operations.yaml#/paths/~1operations~1plans~1{id}"
  /operations/grants:
    $ref: "./operations.yaml#/paths/~1operations~1grants"
  /operations/revoke:
    $ref: "./operations.yaml#/paths/~1operations~1revoke"
  /operations/refunds:
    $ref: "./operations.yaml#/paths/~1operations~1refunds"
  /operations/finance:
    $ref: "./operations.yaml#/paths/~1operations~1finance"
  /operations/finance/settlements:
    $ref: "./operations.yaml#/paths/~1operations~1finance~1settlements"
  /operations/finance/refunds/{billingId}:
    $ref: "./operations.yaml#/paths/~1operations~1finance~1refunds~1{billingId}"
  /operations/finance/payouts:
    $ref: "./operations.yaml#/paths/~1operations~1finance~1payouts"
  /operations/finance/reviews/{id}/decision:
    $ref: "./operations.yaml#/paths/~1operations~1finance~1reviews~1{id}~1decision"
  /operations/finance/invoices/{id}:
    $ref: "./operations.yaml#/paths/~1operations~1finance~1invoices~1{id}"
  /operations/finance/invoices/{id}/document:
    $ref: "./operations.yaml#/paths/~1operations~1finance~1invoices~1{id}~1document"
  /operations/finance/audit:
    $ref: "./operations.yaml#/paths/~1operations~1finance~1audit"
  /member/live-catalog:
    $ref: "./operations.yaml#/paths/~1member~1live-catalog"
  /member/device:
    $ref: "./operations.yaml#/paths/~1member~1device"
  /member/device/change:
    $ref: "./operations.yaml#/paths/~1member~1device~1change"
  /member/courses:
    $ref: "./operations.yaml#/paths/~1member~1courses"
  /member/courses/{id}:
    $ref: "./operations.yaml#/paths/~1member~1courses~1{id}"
  /member/courses/{id}/enroll:
    $ref: "./operations.yaml#/paths/~1member~1courses~1{id}~1enroll"
  /member/courses/{id}/progress:
    $ref: "./operations.yaml#/paths/~1member~1courses~1{id}~1progress"
  /member/courses/{id}/lessons/{lessonId}/playback-link:
    $ref: "./operations.yaml#/paths/~1member~1courses~1{id}~1lessons~1{lessonId}~1playback-link"
  /member/course-playback:
    $ref: "./operations.yaml#/paths/~1member~1course-playback"
  /member/live-classes:
    $ref: "./operations.yaml#/paths/~1member~1live-classes"
  /member/live-classes/{id}/join:
    $ref: "./operations.yaml#/paths/~1member~1live-classes~1{id}~1join"
  /member/offerings/{id}/waitlist:
    $ref: "./operations.yaml#/paths/~1member~1offerings~1{id}~1waitlist"
  /member/waitlist/{id}:
    $ref: "./operations.yaml#/paths/~1member~1waitlist~1{id}"
  /member/waitlist/{id}/accept:
    $ref: "./operations.yaml#/paths/~1member~1waitlist~1{id}~1accept"
  /member/support/tickets:
    $ref: "./operations.yaml#/paths/~1member~1support~1tickets"
  /member/support/tickets/{id}:
    $ref: "./operations.yaml#/paths/~1member~1support~1tickets~1{id}"
  /member/support/tickets/{id}/replies:
    $ref: "./operations.yaml#/paths/~1member~1support~1tickets~1{id}~1replies"
  /member/notifications/settings:
    $ref: "./operations.yaml#/paths/~1member~1notifications~1settings"
  /member/notifications/devices:
    $ref: "./operations.yaml#/paths/~1member~1notifications~1devices"
  /support/staff/tickets:
    $ref: "./operations.yaml#/paths/~1support~1staff~1tickets"
  /support/staff/tickets/{id}:
    $ref: "./operations.yaml#/paths/~1support~1staff~1tickets~1{id}"
  /support/staff/tickets/{id}/replies:
    $ref: "./operations.yaml#/paths/~1support~1staff~1tickets~1{id}~1replies"
  /support/staff/agents:
    $ref: "./operations.yaml#/paths/~1support~1staff~1agents"
  /support/staff/agents/{userId}:
    $ref: "./operations.yaml#/paths/~1support~1staff~1agents~1{userId}"
  /support/staff/agents/{userId}/urgent-alerts:
    $ref: "./operations.yaml#/paths/~1support~1staff~1agents~1{userId}~1urgent-alerts"
  /support/staff/device-changes:
    $ref: "./operations.yaml#/paths/~1support~1staff~1device-changes"
  /support/staff/device-changes/{id}/approve:
    $ref: "./operations.yaml#/paths/~1support~1staff~1device-changes~1{id}~1approve"
  /support/staff/notification-failures:
    $ref: "./operations.yaml#/paths/~1support~1staff~1notification-failures"
  /member/plans:
    $ref: "./operations.yaml#/paths/~1member~1plans"
  /member/checkout:
    $ref: "./operations.yaml#/paths/~1member~1checkout"
  /member/subscription:
    $ref: "./operations.yaml#/paths/~1member~1subscription"
  /member/subscription/cancel:
    $ref: "./operations.yaml#/paths/~1member~1subscription~1cancel"
  /member/profile:
    put:
      operationId: saveMemberProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gender, birthDate]
              properties:
                gender: { type: string, enum: [female, male, unspecified] }
                birthDate: { type: string }
      responses:
        "200":
          description: Eligibility profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberState"
  /member/catalog:
    get:
      operationId: getBookingCatalog
      responses:
        "200":
          description: Server dates and available places
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, kind, targetId, slot, title, startsAt, cancellationDeadline, scope, remaining]
                  properties:
                    id: { type: string }
                    kind: { type: string }
                    targetId: { type: string }
                    slot: { type: string }
                    title: { type: string }
                    startsAt: { type: string }
                    cancellationDeadline: { type: string }
                    scope: { type: string }
                    remaining: { type: integer }
  /member:
    get:
      operationId: getMemberState
      responses:
        "200":
          description: Account-owned membership and reservations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberState"
  /member/preview-membership:
    post:
      operationId: enablePreviewMembership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledgeSampleData]
              properties:
                acknowledgeSampleData:
                  type: boolean
      responses:
        "200":
          description: Preview membership only; never live access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberState"
  /member/bookings:
    post:
      operationId: createMemberBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, targetId]
              properties:
                kind:
                  type: string
                  enum: [session, event, coach]
                targetId:
                  type: string
                slot:
                  type: string
      responses:
        "201":
          description: Reservation saved, not attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberState"
  /member/bookings/{id}:
    delete:
      operationId: cancelMemberBooking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Owner's reservation cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberState"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    PartnerSettlementSummary:
      type: object
      additionalProperties: false
      required: [partnerId, from, to, verifiedVisits, rejectedVisits, onHoldVisits, groups]
      properties:
        partnerId: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        verifiedVisits: { type: integer, minimum: 0 }
        rejectedVisits: { type: integer, minimum: 0 }
        onHoldVisits: { type: integer, minimum: 0 }
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [facility, city, category, accessType, verifiedVisits, rejectedVisits, onHoldVisits]
            properties:
              facility: { type: string }
              city: { type: string }
              category: { type: string }
              accessType: { type: string, enum: [physical, premium, live] }
              verifiedVisits: { type: integer, minimum: 0 }
              rejectedVisits: { type: integer, minimum: 0 }
              onHoldVisits: { type: integer, minimum: 0 }
    PartnerInvoiceUploadInput:
      type: object
      additionalProperties: false
      required: [fileName, size]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 180 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    PartnerInvoiceUploadUrl:
      type: object
      additionalProperties: false
      required: [uploadURL, documentPath]
      properties:
        uploadURL: { type: string, format: uri }
        documentPath: { type: string }
    PartnerInvoiceInput:
      type: object
      additionalProperties: false
      required: [invoiceNumber, amountIqd, issuedAt, periodStart, periodEnd, documentPath, documentName]
      properties:
        invoiceNumber: { type: string, minLength: 1, maxLength: 100 }
        amountIqd: { type: integer, minimum: 1, maximum: 1000000000 }
        issuedAt: { type: string, format: date }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        taxNumber: { type: ["string", "null"], maxLength: 80 }
        documentPath: { type: string, minLength: 1, maxLength: 500 }
        documentName: { type: string, minLength: 1, maxLength: 180 }
    PartnerInvoice:
      type: object
      additionalProperties: false
      required: [id, invoiceNumber, amountIqd, issuedAt, periodStart, periodEnd, taxNumber, documentName, status, createdAt]
      properties:
        id: { type: string }
        invoiceNumber: { type: string }
        amountIqd: { type: integer, minimum: 1 }
        issuedAt: { type: string, format: date }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        taxNumber: { type: ["string", "null"] }
        documentName: { type: string }
        status: { type: string, enum: [submitted, under_review, accepted, rejected] }
        createdAt: { type: string, format: date-time }
    LocalizedFacilityText:
      type: object
      required: [en, ar, ku]
      properties:
        en: { type: string, minLength: 1, maxLength: 500 }
        ar: { type: string, minLength: 1, maxLength: 500 }
        ku: { type: string, minLength: 1, maxLength: 500 }
    FacilityOpeningDay:
      type: object
      required: [day, closed, opensAt, closesAt]
      properties:
        day: { type: integer, minimum: 0, maximum: 6, description: Sunday is 0 and Saturday is 6 }
        closed: { type: boolean }
        opensAt: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        closesAt: { type: ["string", "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    FacilityProfileInput:
      type: object
      required: [partnerId, city, facility, localizedName, localizedDistrict, localizedAddress, localizedDescription, activities, amenities, accessibility, openingHours, contactPhone, websiteUrl, latitude, longitude]
      properties:
        partnerId: { type: string, minLength: 1, maxLength: 160 }
        city: { type: string, minLength: 1, maxLength: 160 }
        facility: { type: string, minLength: 1, maxLength: 160 }
        localizedName: { $ref: "#/components/schemas/LocalizedFacilityText" }
        localizedDistrict: { $ref: "#/components/schemas/LocalizedFacilityText" }
        localizedAddress: { $ref: "#/components/schemas/LocalizedFacilityText" }
        localizedDescription: { $ref: "#/components/schemas/LocalizedFacilityText" }
        activities: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/LocalizedFacilityText" } }
        amenities: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/LocalizedFacilityText" } }
        accessibility: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/LocalizedFacilityText" } }
        openingHours: { type: array, maxItems: 7, items: { $ref: "#/components/schemas/FacilityOpeningDay" } }
        contactPhone: { type: ["string", "null"], maxLength: 40 }
        websiteUrl: { type: ["string", "null"], format: uri, maxLength: 2048 }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
    FacilityProfileUpdate:
      type: object
      required: [city, facility, localizedName, localizedDistrict, localizedAddress, localizedDescription, activities, amenities, accessibility, openingHours, contactPhone, websiteUrl, latitude, longitude]
      properties:
        city: { type: string, minLength: 1, maxLength: 160 }
        facility: { type: string, minLength: 1, maxLength: 160 }
        localizedName: { $ref: "#/components/schemas/LocalizedFacilityText" }
        localizedDistrict: { $ref: "#/components/schemas/LocalizedFacilityText" }
        localizedAddress: { $ref: "#/components/schemas/LocalizedFacilityText" }
        localizedDescription: { $ref: "#/components/schemas/LocalizedFacilityText" }
        activities: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/LocalizedFacilityText" } }
        amenities: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/LocalizedFacilityText" } }
        accessibility: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/LocalizedFacilityText" } }
        openingHours: { type: array, maxItems: 7, items: { $ref: "#/components/schemas/FacilityOpeningDay" } }
        contactPhone: { type: ["string", "null"], maxLength: 40 }
        websiteUrl: { type: ["string", "null"], format: uri, maxLength: 2048 }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
    FacilityProfile:
      type: object
